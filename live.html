<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Live — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Bebas+Neue&family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      overflow: hidden;
    }

    #canvas1920 {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
    }

    /* Logo Tiempo Fuera fijo arriba a la derecha con sombra clara detrás */
    .tf-corner-logo-wrap {
      position: absolute;
      top: 26px;
      right: 34px;
      z-index: 50;
      pointer-events: none;
      padding: 6px;
      border-radius: 12px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.58) 0%, rgba(255, 255, 255, 0.16) 62%, rgba(255, 255, 255, 0) 100%);
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.82)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
    }

    .tf-corner-logo {
      height: 52px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: block;
    }

    .live-layer {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .live-layer.is-visible {
      opacity: 1;
    }

    /* Banner centrado de 10 segundos al lanzar Competencia Especial */
    .special-banner-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 45;
    }

    .special-banner-wrap.is-shown {
      opacity: 1;
      transform: scale(1);
    }

    .special-banner-card {
      position: relative;
      background: rgba(128, 134, 146, 0.72);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px;
      padding: 28px 56px;
      text-align: center;
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.55);
      font-family: 'Barlow Condensed', sans-serif;
      overflow: hidden;
    }

    .special-banner-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 120px;
      height: 100%;
      background: linear-gradient(120deg, rgba(225, 29, 46, 0.85) 0%, rgba(225, 29, 46, 0) 100%);
      clip-path: polygon(0 0, 100% 0, 62% 100%, 0 100%);
      pointer-events: none;
    }

    .special-banner-sub {
      position: relative;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
      margin-bottom: 4px;
    }

    .special-banner-title {
      position: relative;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.7);
      line-height: 1;
    }

    /* Gráfica dinámica de Competencias Especiales con recuadro gris semitransparente */
    #live-especiales {
      left: 50%;
      bottom: 44px;
      transform: translateX(-50%);
      width: 1240px;
      font-family: 'Barlow Condensed', sans-serif;
      z-index: 25;
    }

    .sp-shell {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sp-panel {
      position: relative;
      background: rgba(132, 138, 150, 0.68);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 16px 22px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
      color: #ffffff;
      overflow: hidden;
    }

    .sp-panel::after {
      content: "";
      position: absolute;
      right: -28px;
      bottom: -28px;
      width: 160px;
      height: 160px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.35) 2px, transparent 2px);
      background-size: 12px 12px;
      pointer-events: none;
    }

    .sp-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      padding-bottom: 10px;
      margin-bottom: 12px;
      gap: 12px;
    }

    .sp-brand-line {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #ffffff;
      background: #c81e2b;
      padding: 3px 10px;
      border-radius: 5px;
      display: inline-block;
      margin-right: 10px;
    }

    .sp-title {
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      display: inline-flex;
      align-items: center;
    }

    .sp-inst {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sp-active-box {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(32, 36, 44, 0.58);
      border-left: 5px solid #e11d2e;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .sp-shooter-name {
      font-size: 30px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      color: #ffffff;
    }

    .sp-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex: 1;
      justify-content: center;
      align-items: center;
    }

    .sp-ball-chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .sp-ball-chip.hit {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.65);
    }

    .sp-ball-chip.miss {
      background: rgba(17, 24, 39, 0.45);
      color: rgba(255, 255, 255, 0.55);
      font-size: 16px;
      font-weight: 800;
    }

    .sp-score-val {
      font-size: 40px;
      font-weight: 800;
      line-height: 0.95;
      color: #ffffff;
    }

    .sp-board-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .sp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(32, 36, 44, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.24);
      font-size: 20px;
      font-weight: 700;
    }

    .sp-row.is-winner {
      background: rgba(200, 30, 43, 0.72);
      border-color: #ffffff;
    }

    /* Zócalo inferior de reglas de competencia */
    .sp-rules-bar {
      background: rgba(110, 116, 128, 0.76);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      border-left: 6px solid #e11d2e;
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
    }

    .sp-rules-label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(17, 24, 39, 0.55);
      padding: 3px 9px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .sp-rules-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
      color: #ffffff;
    }

    .social-pill-wrap {
      position: absolute;
      top: 44px;
      left: 48px;
      transform: translateX(-36px) scale(var(--social-scale, 1.35));
      transform-origin: top left;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
      z-index: 30;
    }

    .social-pill-wrap.pos-top-right {
      left: auto;
      right: 185px;
      transform-origin: top right;
      transform: translateX(36px) scale(var(--social-scale, 1.35));
    }

    .social-pill-wrap.active {
      opacity: 1;
      transform: translateX(0) scale(var(--social-scale, 1.35));
    }

    .social-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #14171f;
      border: 2px solid var(--sb-accent, #9ca3af);
      border-radius: 10px;
      padding: 9px 18px 9px 13px;
      white-space: nowrap;
      font-family: 'Barlow Condensed', sans-serif;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
    }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .social-icon.ig {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    .social-icon.yt {
      background: linear-gradient(135deg, #ff1e1e 0%, #b80000 100%);
    }

    .social-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .social-cta {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--sb-accent, #e5e7eb);
    }

    .social-handle {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    @keyframes basketBurst {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.55); }
      25% { opacity: 1; transform: translate(-50%, -22px) scale(1.28); }
      75% { opacity: 1; transform: translate(-50%, -28px) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -36px) scale(0.95); }
    }

    .pts-pop-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      font-weight: 900;
      font-size: 26px;
      line-height: 1;
      padding: 3px 10px;
      border-radius: 7px;
      z-index: 40;
      pointer-events: none;
      animation: basketBurst 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .pts-pop-badge.triple {
      background: #f59e0b;
      color: #111;
      border: 1.5px solid #fff;
    }

    .pts-pop-badge.doble {
      background: #fff;
      color: #111;
      border: 1.5px solid var(--sb-accent, #9ca3af);
    }
  </style>
</head>
<body>
  <div id="canvas1920">
    <!-- Logo Tiempo Fuera fijo arriba a la derecha con sombra clara detrás -->
    <div class="tf-corner-logo-wrap">
      <img src="./logotf.png" alt="Tiempo Fuera" class="tf-corner-logo" id="tfCornerLogo">
    </div>

    <div class="social-pill-wrap" id="socialWrap">
      <div class="social-pill" id="socialCard"></div>
    </div>

    <div class="special-banner-wrap" id="specialBanner">
      <div class="special-banner-card">
        <div class="special-banner-sub">TIEMPO FUERA · COMPETENCIA ESPECIAL</div>
        <div class="special-banner-title" id="specialBannerTitle">CONCURSO DE TRIPLES</div>
      </div>
    </div>

    <div id="live-marcadores" class="live-layer" style="left: 50%; top: 84%; transform: translateX(-50%);">
      <div id="marcadorMount"></div>
    </div>

    <div id="live-especiales" class="live-layer">
      <div id="especialesMount"></div>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    const IG_SVG = `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>`;
    const YT_SVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"></path></svg>`;

    const canvas1920 = document.getElementById("canvas1920");
    function fitViewportTo1920() {
      const sx = window.innerWidth / 1920;
      const sy = window.innerHeight / 1080;
      const scale = Math.min(sx, sy);
      const offsetX = Math.round((window.innerWidth - 1920 * scale) / 2);
      const offsetY = Math.round((window.innerHeight - 1080 * scale) / 2);
      canvas1920.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }
    fitViewportTo1920();
    window.addEventListener("resize", fitViewportTo1920);

    let cfg = {
      sources: {
        points_1: "manual",
        points_2: "manual",
        timer: "manual",
        period: "manual",
        fouls_1: "manual",
        fouls_2: "manual",
        shotclock: "scoresight"
      },
      posX: 50,
      posY: 84,
      fontFamily: "'Barlow Condensed', sans-serif",
      boardScale: 1.0,
      ligaSize: 92,
      teamLogoSize: 44,
      teamFontSize: 25,
      scoreBoxSize: 48,
      clockFontSize: 32,
      accentColor: "#9ca3af",
      foulActiveColor: "#e5e7eb",
      foulBonusColor: "#dc2626",
      name1: "LOCAL",
      bg1Color: "#2b2d33",
      text1Color: "#f3f4f6",
      name2: "VISITA",
      bg2Color: "#2b2d33",
      text2Color: "#f3f4f6",
      scoreBgColor: "#14161a",
      scoreTextColor: "#f3f4f6",
      shotBgColor: "#181a20",
      shotTextColor: "#f87171",
      clockBgColor: "#1b1e24",
      clockTextColor: "#ffffff",
      periodTextColor: "#d1d5db",
      showShotClock: true,
      topBadgeEnabled: false,
      topBadgeType: "text",
      topTextValue: "",
      topBadgeOffsetY: -24,
      topBadgeFontSize: 16,
      topBadgeMaxSize: 36,
      logoLiga: "",
      logo1: "",
      logo2: "",
      logoTop: "",
      socialAutoEnabled: true,
      socialPosition: "top-left",
      socialScale: 1.35,
      socialIntervalSec: 150
    };

    let feeds = { scoresight: {}, flexyscore: {}, manual: {} };
    let marcadoresEnabled = true;
    let marcadoresOn = false;
    let especialesEnabled = false;
    let especialesConfig = {};
    let especialesLive = null;

    let prevPts1 = null;
    let prevPts2 = null;
    let lastCmdTs = 0;
    let lastBannerTs = 0;
    let bannerHideTimeout = null;
    let lastRenderedConfigSig = "";

    function syncCornerLogoScale() {
      const tfImg = document.getElementById("tfCornerLogo");
      if (!tfImg) return;
      const baseH = cfg.logoLiga ? Math.max(40, Math.min(72, Math.round((cfg.ligaSize || 92) * 0.56))) : 52;
      tfImg.style.height = `${baseH}px`;
    }

    function lum(hex) {
      hex = (hex || "#2b2d33").replace("#", "");
      if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    function shade(hex, pct) {
      hex = (hex || "#2b2d33").replace("#", "");
      let r = parseInt(hex.substring(0, 2), 16) || 0;
      let g = parseInt(hex.substring(2, 4), 16) || 0;
      let b = parseInt(hex.substring(4, 6), 16) || 0;
      if (pct >= 0) {
        r = Math.min(255, Math.floor(r + (255 - r) * pct));
        g = Math.min(255, Math.floor(g + (255 - g) * pct));
        b = Math.min(255, Math.floor(b + (255 - b) * pct));
      } else {
        const f = 1 + pct;
        r = Math.max(0, Math.floor(r * f));
        g = Math.max(0, Math.floor(g * f));
        b = Math.max(0, Math.floor(b * f));
      }
      return "#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    function resolveField(fieldName, altKeys = []) {
      const srcMap = cfg.sources || {};
      const preferred = srcMap[fieldName] || "manual";
      const order = [preferred, "manual", "scoresight", "flexyscore"].filter((v, i, a) => a.indexOf(v) === i);
      for (const src of order) {
        const bucket = feeds[src] || {};
        for (const k of [fieldName, ...altKeys]) {
          if (bucket[k] !== undefined && bucket[k] !== null && bucket[k] !== "") return bucket[k];
        }
      }
      return undefined;
    }

    function actualizarFaltas(id, cantidad) {
      const cont = document.getElementById(id);
      if (!cont) return;
      const barras = cont.querySelectorAll(".foul-bar");
      const num = parseInt(cantidad, 10) || 0;
      barras.forEach((b, idx) => {
        const n = idx + 1;
        if (n <= num) {
          b.style.background = n === 5 ? cfg.foulBonusColor : cfg.foulActiveColor;
          b.style.border = "1px solid #111111";
        } else {
          b.style.background = "rgba(0,0,0,0.35)";
          b.style.border = "1px solid rgba(255,255,255,0.45)";
        }
      });
    }

    function formatearPeriodo(momentRaw) {
      const n = parseInt(String(momentRaw ?? "").replace(/[^0-9]/g, ""), 10);
      if (isNaN(n) || n <= 0) return "Q1";
      return n <= 4 ? "Q" + n : "OT" + (n - 4);
    }

    function animarCanasta(slotId, ptsId, val, delta) {
      const slot = document.getElementById(slotId);
      const el = document.getElementById(ptsId);
      if (!slot || !el) return;
      const badge = document.createElement("div");
      badge.className = "pts-pop-badge " + (delta === 3 ? "triple" : "doble");
      badge.textContent = "+" + delta;
      slot.appendChild(badge);
      setTimeout(() => { el.textContent = val; }, 340);
      setTimeout(() => badge.remove(), 1200);
    }

    function buildTopBadgeLive() {
      if (!cfg.topBadgeEnabled) return "";
      const yOff = cfg.topBadgeOffsetY ?? -24;
      if (cfg.topBadgeType === "image" && cfg.logoTop) {
        const maxH = cfg.topBadgeMaxSize || 36;
        return `<div style="position:absolute;top:${yOff}px;left:50%;transform:translateX(-50%);max-width:170px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;">
          <img src="${cfg.logoTop}" style="max-height:${maxH}px;max-width:165px;object-fit:contain;display:block;">
        </div>`;
      }
      if (!cfg.topTextValue) return "";
      const fSize = cfg.topBadgeFontSize || 16;
      return `<div style="position:absolute;top:${yOff}px;left:50%;transform:translateX(-50%);max-width:175px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:${cfg.scoreBgColor};border:1.5px solid ${cfg.accentColor};border-radius:6px;padding:2px 12px;font-size:${fSize}px;font-weight:800;color:#fff;z-index:5;">${cfg.topTextValue}</div>`;
    }

    function renderEstructura() {
      document.documentElement.style.setProperty("--sb-accent", cfg.accentColor || "#9ca3af");
      syncCornerLogoScale();

      const layer = document.getElementById("live-marcadores");
      layer.style.left = `${cfg.posX ?? 50}%`;
      layer.style.top = `${cfg.posY ?? 84}%`;
      layer.style.transform = "translateX(-50%)";

      const stripe1 = lum(cfg.bg1Color) > 0.55 ? "rgba(0,0,0,0.09)" : "rgba(255,255,255,0.06)";
      const stripe2 = lum(cfg.bg2Color) > 0.55 ? "rgba(0,0,0,0.09)" : "rgba(255,255,255,0.06)";
      const foulsBase = Array.from({ length: 5 }, (_, i) => `<span class="foul-bar" data-idx="${i + 1}"></span>`).join("");

      const topHtml = buildTopBadgeLive();
      const shotHtml = cfg.showShotClock
        ? `<div id="shotclock" style="position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);background:${cfg.shotBgColor};color:${cfg.shotTextColor};border:1.5px solid ${cfg.accentColor};border-radius:6px;font-size:19px;font-weight:800;padding:0 7px;min-width:36px;text-align:center;"></div>`
        : "";

      document.getElementById("marcadorMount").innerHTML = `
        <style>
          .lm-bar {
            transform: scale(${cfg.boardScale || 1});
            transform-origin: top center;
            display: inline-flex;
            align-items: center;
            height: 92px;
            font-family: ${cfg.fontFamily};
            user-select: none;
            overflow: visible;
          }
          .lm-wing {
            position: relative;
            display: flex;
            align-items: center;
            height: 60px;
            min-width: 215px;
            padding: 0 14px;
            gap: 10px;
            overflow: hidden;
            border-top: 1.5px solid ${cfg.accentColor};
            border-bottom: 2px solid ${cfg.accentColor};
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
          }
          .lm-wing.home {
            background: linear-gradient(90deg, ${shade(cfg.bg1Color, -0.14)} 0%, ${cfg.bg1Color} 45%, ${shade(cfg.bg1Color, 0.2)} 100%);
            border-left: 1.5px solid ${cfg.accentColor};
            border-radius: 10px 0 0 10px;
          }
          .lm-wing.home::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(-45deg, ${stripe1} 0px, ${stripe1} 2px, transparent 2px, transparent 6px);
            pointer-events: none;
          }
          .lm-wing.away {
            flex-direction: row-reverse;
            background: linear-gradient(270deg, ${shade(cfg.bg2Color, -0.14)} 0%, ${cfg.bg2Color} 45%, ${shade(cfg.bg2Color, 0.2)} 100%);
            border-right: 1.5px solid ${cfg.accentColor};
            border-radius: 0 10px 10px 0;
          }
          .lm-wing.away::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(45deg, ${stripe2} 0px, ${stripe2} 2px, transparent 2px, transparent 6px);
            pointer-events: none;
          }
          .lm-team-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 1;
            position: relative;
            z-index: 2;
          }
          .lm-name {
            font-size: ${cfg.teamFontSize || 25}px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
          }
          .lm-fouls {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
          }
          .foul-bar {
            width: 19px;
            height: 5px;
            border-radius: 2px;
            display: inline-block;
          }
          .lm-scores {
            position: relative;
            display: flex;
            align-items: center;
            height: 68px;
            padding: 0 14px;
            gap: 8px;
            background: linear-gradient(180deg, ${shade(cfg.scoreBgColor, 0.14)} 0%, ${cfg.scoreBgColor} 55%, ${shade(cfg.scoreBgColor, -0.18)} 100%);
            border: 2px solid ${cfg.accentColor};
            border-radius: 9px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
            overflow: visible;
            z-index: 3;
          }
          .lm-slot {
            position: relative;
            min-width: 54px;
            text-align: center;
            overflow: visible;
          }
          .lm-pts {
            font-size: ${cfg.scoreBoxSize || 48}px;
            font-weight: 800;
            color: ${cfg.scoreTextColor};
            font-variant-numeric: tabular-nums;
            line-height: 0.92;
          }
          .lm-clock {
            display: flex;
            align-items: center;
            height: 60px;
            margin-left: 8px;
            padding: 0 14px;
            gap: 10px;
            background: linear-gradient(180deg, ${shade(cfg.clockBgColor, 0.14)} 0%, ${cfg.clockBgColor} 55%, ${shade(cfg.clockBgColor, -0.16)} 100%);
            border: 1.5px solid ${cfg.accentColor};
            border-radius: 10px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
          }
          .lm-timer {
            font-size: ${cfg.clockFontSize || 32}px;
            font-weight: 700;
            color: ${cfg.clockTextColor};
            font-variant-numeric: tabular-nums;
          }
          .lm-period {
            font-size: ${Math.round((cfg.clockFontSize || 32) * 0.72)}px;
            font-weight: 800;
            color: ${cfg.periodTextColor};
            background: rgba(255,255,255,0.08);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
          }
        </style>
        <div class="lm-bar">
          ${cfg.logoLiga ? `<img src="${cfg.logoLiga}" style="height:${cfg.ligaSize || 92}px;margin-right:10px;object-fit:contain;">` : ""}
          <div class="lm-wing home">
            ${cfg.logo1 ? `<img src="${cfg.logo1}" style="height:${cfg.teamLogoSize || 44}px;width:${cfg.teamLogoSize || 44}px;object-fit:contain;position:relative;z-index:2;">` : ""}
            <div class="lm-team-center">
              <div class="lm-name" style="color:${cfg.text1Color};">${cfg.name1}</div>
              <div class="lm-fouls" id="fouls1">${foulsBase}</div>
            </div>
          </div>
          <div class="lm-scores">
            ${topHtml}
            <div class="lm-slot" id="slotPoints1"><div class="lm-pts" id="points1">${prevPts1 ?? 0}</div></div>
            <span style="color:${cfg.accentColor};font-size:28px;font-weight:800;">-</span>
            <div class="lm-slot" id="slotPoints2"><div class="lm-pts" id="points2">${prevPts2 ?? 0}</div></div>
            ${shotHtml}
          </div>
          <div class="lm-wing away">
            ${cfg.logo2 ? `<img src="${cfg.logo2}" style="height:${cfg.teamLogoSize || 44}px;width:${cfg.teamLogoSize || 44}px;object-fit:contain;position:relative;z-index:2;">` : ""}
            <div class="lm-team-center">
              <div class="lm-name" style="color:${cfg.text2Color};">${cfg.name2}</div>
              <div class="lm-fouls" id="fouls2">${foulsBase}</div>
            </div>
          </div>
          <div class="lm-clock">
            <div class="lm-timer" id="timer">10:00</div>
            <div class="lm-period" id="period">Q1</div>
          </div>
        </div>
      `;
      aplicarDatos(prevPts1 === null && prevPts2 === null);
    }

    function aplicarDatos(esInicial = false) {
      const p1Raw = String(resolveField("points_1", ["points1", "score_1", "score1"]) ?? "").replace(/[^0-9]/g, "");
      const p2Raw = String(resolveField("points_2", ["points2", "score_2", "score2"]) ?? "").replace(/[^0-9]/g, "");

      if (p1Raw !== "") {
        const n1 = parseInt(p1Raw, 10);
        const el1 = document.getElementById("points1");
        if (el1) {
          if (!esInicial && prevPts1 !== null && (n1 - prevPts1 === 2 || n1 - prevPts1 === 3)) {
            animarCanasta("slotPoints1", "points1", p1Raw, n1 - prevPts1);
          } else {
            el1.textContent = p1Raw;
          }
        }
        prevPts1 = n1;
      }

      if (p2Raw !== "") {
        const n2 = parseInt(p2Raw, 10);
        const el2 = document.getElementById("points2");
        if (el2) {
          if (!esInicial && prevPts2 !== null && (n2 - prevPts2 === 2 || n2 - prevPts2 === 3)) {
            animarCanasta("slotPoints2", "points2", p2Raw, n2 - prevPts2);
          } else {
            el2.textContent = p2Raw;
          }
        }
        prevPts2 = n2;
      }

      const tVal = resolveField("timer");
      if (tVal !== undefined) {
        const tEl = document.getElementById("timer");
        if (tEl) tEl.textContent = tVal;
      }

      const qVal = resolveField("period", ["moment"]);
      if (qVal !== undefined) {
        const perEl = document.getElementById("period");
        if (perEl) perEl.textContent = formatearPeriodo(qVal);
      }

      const f1Val = resolveField("fouls_1", ["fouls1"]);
      if (f1Val !== undefined) actualizarFaltas("fouls1", f1Val);

      const f2Val = resolveField("fouls_2", ["fouls2"]);
      if (f2Val !== undefined) actualizarFaltas("fouls2", f2Val);

      const scVal = resolveField("shotclock", ["shot_clock", "shot"]);
      if (cfg.showShotClock && scVal !== undefined) {
        const scEl = document.getElementById("shotclock");
        if (scEl) scEl.textContent = String(scVal).replace(/[^0-9]/g, "");
      }
    }

    function triggerSpecialBanner(titleText) {
      const wrap = document.getElementById("specialBanner");
      const titleEl = document.getElementById("specialBannerTitle");
      if (!wrap || !titleEl) return;
      titleEl.textContent = titleText || "COMPETENCIA ESPECIAL";
      wrap.classList.add("is-shown");
      clearTimeout(bannerHideTimeout);
      bannerHideTimeout = setTimeout(() => {
        wrap.classList.remove("is-shown");
      }, 10000);
    }

    function renderEspecialesLive() {
      const mount = document.getElementById("especialesMount");
      const layer = document.getElementById("live-especiales");
      const show = Boolean(especialesEnabled && especialesLive?.active);
      layer.classList.toggle("is-visible", show);

      if (!show || !especialesLive) return;

      const compType = especialesLive.compType || "triples";
      const compTitle = compType === "tiros_libres" ? "CONCURSO DE TIROS LIBRES" : "CONCURSO DE TRIPLES";
      const shooters = especialesLive.shooters || [];
      const turnShots = especialesLive.turnShots || [];
      const activeShooter = shooters.find((s) => s.id === especialesLive.activeId) || null;
      const turnPts = turnShots.reduce((acc, s) => acc + (s.hit ? (s.pts || 1) : 0), 0);
      const rulesText = especialesLive.rulesText
        || especialesConfig.rules?.[compType]
        || (compType === "tiros_libres"
          ? "Turnos de tiros libres desde la línea. Mayor puntaje define la ronda."
          : "Rondas de triples desde el perímetro. Mayor puntaje avanza.");

      // Balones sin números +1 / +3 al lado
      const ballsHtml = turnShots.map((s) =>
        s.hit
          ? `<span class="sp-ball-chip hit">🏀</span>`
          : `<span class="sp-ball-chip miss">✕</span>`
      ).join("");

      const activeHtml = activeShooter
        ? `<div class="sp-active-box">
            <div class="sp-shooter-name">${activeShooter.name}</div>
            <div class="sp-balls">${ballsHtml}</div>
            <div style="text-align:right; min-width:88px;">
              <div style="font-size:13px; letter-spacing:1.2px; font-weight:800; opacity:0.85;">TURNO</div>
              <div class="sp-score-val">${turnPts}</div>
            </div>
          </div>`
        : "";

      const listHtml = shooters.map((s, idx) => {
        const isWin = s.id === especialesLive.winnerId;
        return `<div class="sp-row ${isWin ? "is-winner" : ""}">
          <span>#${idx + 1} ${s.name}</span>
          <span style="font-weight:800;">${s.score ?? 0}</span>
        </div>`;
      }).join("");

      mount.innerHTML = `
        <div class="sp-shell">
          <div class="sp-panel">
            <div class="sp-header">
              <div class="sp-title">
                <span class="sp-brand-line">TIEMPO FUERA</span>
                <span>${compTitle}</span>
              </div>
              <div class="sp-inst">${especialesLive.closed ? "RONDA CERRADA" : "EN JUEGO"}</div>
            </div>
            ${activeHtml}
            <div class="sp-board-grid">${listHtml}</div>
          </div>

          <div class="sp-rules-bar">
            <span class="sp-rules-label">REGLAS</span>
            <span class="sp-rules-text">${rulesText}</span>
          </div>
        </div>
      `;
    }

    function syncLayerVisibility() {
      const mLayer = document.getElementById("live-marcadores");
      const compActive = Boolean(especialesEnabled && especialesLive?.active);
      if (marcadoresEnabled && marcadoresOn && !compActive) {
        mLayer.classList.add("is-visible");
      } else {
        mLayer.classList.remove("is-visible");
      }
      renderEspecialesLive();
    }

    let turnoSocial = 0;
    let socialTimer = null;

    function mostrarSocial(net) {
      if (net === "ig") turnoSocial = 0;
      if (net === "yt") turnoSocial = 1;
      const wrap = document.getElementById("socialWrap");
      const card = document.getElementById("socialCard");
      wrap.classList.toggle("pos-top-right", cfg.socialPosition === "top-right");
      wrap.style.setProperty("--social-scale", cfg.socialScale || 1.35);

      card.innerHTML = turnoSocial === 0
        ? `<div class="social-icon ig">${IG_SVG}</div><div class="social-texts"><span class="social-cta">Síguenos en Instagram</span><span class="social-handle">@tiempofuera_cl</span></div>`
        : `<div class="social-icon yt">${YT_SVG}</div><div class="social-texts"><span class="social-cta">¡Suscríbete en YouTube!</span><span class="social-handle">@tiempofuera_cl</span></div>`;

      turnoSocial = (turnoSocial + 1) % 2;
      wrap.classList.add("active");
      clearTimeout(socialTimer);
      socialTimer = setTimeout(() => wrap.classList.remove("active"), 11000);
    }

    setInterval(() => {
      if (cfg.socialAutoEnabled) {
        mostrarSocial();
      }
    }, (cfg.socialIntervalSec || 150) * 1000);

    onValue(ref(db, `${DB_PATH}/modules/marcadores`), (snap) => {
      if (!snap.exists()) return;
      const mod = snap.val();
      const layer = document.getElementById("live-marcadores");

      if (mod.config) {
        const nextCfg = {
          ...cfg,
          ...mod.config,
          posX: mod.pos?.x ?? mod.config.posX ?? 50,
          posY: mod.pos?.y ?? mod.config.posY ?? 84,
          sources: { ...cfg.sources, ...(mod.config.sources || {}) }
        };
        const nextSig = JSON.stringify(nextCfg);
        cfg = nextCfg;
        if (nextSig !== lastRenderedConfigSig) {
          lastRenderedConfigSig = nextSig;
          renderEstructura();
        }
      } else if (mod.pos) {
        layer.style.left = `${mod.pos.x ?? 50}%`;
        layer.style.top = `${mod.pos.y ?? 84}%`;
      }

      feeds = {
        scoresight: { ...(mod.liveData || {}), ...(mod.feeds?.scoresight || {}) },
        flexyscore: { ...(mod.feeds?.flexyscore || {}) },
        manual: { ...(mod.feeds?.manual || {}) }
      };
      aplicarDatos(false);

      if (mod.cmd?.action === "social_now" && mod.cmd.ts && mod.cmd.ts !== lastCmdTs) {
        lastCmdTs = mod.cmd.ts;
        mostrarSocial(mod.cmd.network);
      }

      marcadoresEnabled = mod.enabled !== false;
      marcadoresOn = Boolean(mod.on);
      syncLayerVisibility();
    });

    onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
      if (!snap.exists()) {
        especialesEnabled = false;
        especialesConfig = {};
        especialesLive = null;
        syncLayerVisibility();
        return;
      }
      const val = snap.val();
      especialesEnabled = Boolean(val.enabled);
      especialesConfig = val.config || {};
      especialesLive = val.live || null;

      if (especialesEnabled && especialesLive?.active && especialesLive.bannerTs && especialesLive.bannerTs !== lastBannerTs) {
        lastBannerTs = especialesLive.bannerTs;
        triggerSpecialBanner(especialesLive.bannerTitle);
      }

      syncLayerVisibility();
    });

    syncCornerLogoScale();
  </script>
</body>
</html>
