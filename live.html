<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Live — Studio TF 2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .live-item {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .live-item.is-visible {
      opacity: 1;
    }
    .live-sb {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(14, 14, 18, 0.95);
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-weight: 800;
      font-size: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    .live-sb.style-compact {
      font-size: 22px;
      padding: 8px 16px;
      border-radius: 5px;
    }
    .live-team {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #1d1e26;
      padding: 6px 14px;
      border-radius: 5px;
      border-left: 6px solid #e11d2e;
    }
    .live-score {
      font-variant-numeric: tabular-nums;
    }
    .live-meta {
      font-size: 20px;
      color: #e4e4ee;
      border-left: 2px solid rgba(255, 255, 255, 0.22);
      padding-left: 16px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="live-marcadores" class="live-item">
    <div id="live-sb-box" class="live-sb">
      <span id="live-local-team" class="live-team">
        <span id="live-local-name">LOC</span>
        <span id="live-local-score" class="live-score">0</span>
      </span>
      <span style="color: #9898a6;">-</span>
      <span id="live-visita-team" class="live-team">
        <span id="live-visita-score" class="live-score">0</span>
        <span id="live-visita-name">VIS</span>
      </span>
      <span id="live-meta" class="live-meta">1° · 10:00</span>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    function renderMarcador(data = {}) {
      const box = document.getElementById("live-sb-box");
      box.classList.toggle("style-compact", data.style === "compact");

      const localTeam = document.getElementById("live-local-team");
      const visitaTeam = document.getElementById("live-visita-team");
      localTeam.style.borderLeftColor = data.localColor || "#e11d2e";
      visitaTeam.style.borderLeftColor = data.visitaColor || "#2563eb";

      document.getElementById("live-local-name").textContent = data.localName || "LOC";
      document.getElementById("live-local-score").textContent = data.localScore ?? 0;
      document.getElementById("live-visita-name").textContent = data.visitaName || "VIS";
      document.getElementById("live-visita-score").textContent = data.visitaScore ?? 0;
      document.getElementById("live-meta").textContent = `${data.period || "1°"} · ${data.clock || "10:00"}`;
    }

    onValue(ref(db, `${DB_PATH}/modules`), (snap) => {
      const mods = snap.val() || {};
      Object.entries(mods).forEach(([key, cfg]) => {
        const el = document.getElementById(`live-${key}`);
        if (!el) return;

        if (cfg.pos) {
          el.style.left = `${cfg.pos.x ?? 5}%`;
          el.style.top = `${cfg.pos.y ?? 6}%`;
        }

        if (key === "marcadores") {
          renderMarcador(cfg.data);
        }

        if (cfg.enabled && cfg.on) {
          el.classList.add("is-visible");
        } else {
          el.classList.remove("is-visible");
        }
      });
    });
  </script>
</body>
</html>
