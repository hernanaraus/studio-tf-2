<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Live Overlay — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Barlow Condensed', sans-serif; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      background: transparent !important;
      overflow: hidden;
    }

    .layer-fade {
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .layer-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(14px);
    }

    /* ==================== 1. MARCADOR DE PARTIDO ==================== */
    .match-stage {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .match-stage.layer-hidden {
      transform: translate(-50%, 16px);
    }
    .match-top-tag {
      background: rgba(16, 19, 26, 0.94);
      color: #e3b857;
      border: 1px solid rgba(227, 184, 87, 0.5);
      border-bottom: none;
      padding: 2px 16px;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    .match-bar {
      display: flex;
      align-items: stretch;
      height: 82px;
      background: rgba(16, 19, 26, 0.96);
      border: 2px solid #e3b857;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
    }
    .team-block {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      min-width: 280px;
      position: relative;
    }
    .team-block.right {
      flex-direction: row-reverse;
      text-align: right;
    }
    .team-accent-bar {
      width: 7px;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .team-block.right .team-accent-bar {
      left: auto;
      right: 0;
    }
    .team-logo-img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.35));
      flex-shrink: 0;
    }
    .team-logo-img.empty { display: none; }
    .team-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .team-name {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      line-height: 0.98;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    .fouls-dots {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }
    .team-block.right .fouls-dots { justify-content: flex-end; }
    .foul-dot {
      width: 11px;
      height: 6px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
    }
    .foul-dot.active { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .foul-dot.bonus { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    .score-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 52px;
      font-weight: 900;
      color: #fff;
      font-variant-numeric: tabular-nums;
      border-left: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
    }
    .clock-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      padding: 6px 18px;
      background: #0b0d12;
    }
    .clock-period {
      font-size: 14px;
      font-weight: 900;
      color: #e3b857;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .clock-time {
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      line-height: 0.96;
      font-variant-numeric: tabular-nums;
    }
    .clock-time.clutch { color: #ef4444; }

    /* ==================== 2. BANNER CENTRADO 10 SEGUNDOS ==================== */
    .intro-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: linear-gradient(135deg, rgba(16, 19, 26, 0.97), rgba(28, 33, 46, 0.97));
      border: 3px solid #e3b857;
      border-radius: 18px;
      padding: 28px 56px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      z-index: 30;
    }
    .intro-banner.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .intro-kicker {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #e3b857;
      text-transform: uppercase;
    }
    .intro-main {
      font-size: 56px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.05;
      margin-top: 4px;
    }
    .intro-sub {
      font-size: 20px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ==================== 3. MARCADOR COMPETENCIAS ESPECIALES ==================== */
    .comp-stage {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .comp-stage.layer-hidden {
      transform: translate(-50%, 16px);
    }
    .comp-bar {
      display: flex;
      align-items: stretch;
      min-height: 94px;
      background: rgba(16, 19, 26, 0.96);
      border: 2px solid #e3b857;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.85);
    }
    .comp-meta {
      padding: 10px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      min-width: 230px;
    }
    .comp-title {
      font-size: 16px;
      font-weight: 900;
      color: #e3b857;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .comp-round {
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .comp-leader {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: rgba(255,255,255,0.08);
      padding: 2px 9px;
      border-radius: 4px;
      width: fit-content;
    }
    .comp-leader span { color: #e3b857; }

    .comp-player {
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 300px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }
    .comp-player-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.38));
      flex-shrink: 0;
    }
    .comp-player-logo.empty { display: none; }
    .comp-player-name {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      line-height: 0.98;
      white-space: nowrap;
    }
    .comp-player-team {
      font-size: 15px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .comp-score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 24px;
      min-width: 120px;
      background: linear-gradient(180deg, rgba(227, 184, 87, 0.22) 0%, rgba(227, 184, 87, 0.06) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }
    .comp-score-box small, .comp-shots-box small {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.3px;
      color: #cbd5e1;
      text-transform: uppercase;
    }
    .comp-score-val {
      font-size: 54px;
      font-weight: 900;
      color: #e3b857;
      line-height: 0.92;
      font-variant-numeric: tabular-nums;
    }

    .comp-shots-box {
      padding: 10px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-width: 340px;
    }
    .bballs-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
    }
    .bball-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .bball-icon.hit {
      background: radial-gradient(circle at 30% 30%, #fb923c, #c2410c);
      border: 1.5px solid #fed7aa;
      box-shadow: 0 0 10px rgba(234, 88, 12, 0.75);
    }
    .bball-icon.bonus {
      background: radial-gradient(circle at 30% 30%, #fde047, #d97706);
      color: #111;
      font-size: 12px;
      border: 1.5px solid #fff;
    }
    .bball-icon.miss {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.42);
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    /* ==================== 4. TOAST REDES SOCIALES ==================== */
    .social-toast {
      position: absolute;
      top: 44px;
      right: 48px;
      background: rgba(16, 19, 26, 0.95);
      border: 2px solid #e3b857;
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.8px;
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .social-toast.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <!-- Toast Redes -->
  <div class="social-toast" id="socialToast">@tiempofuera_cl</div>

  <!-- Banner Centrado 10 Segundos Competencia Especial -->
  <div class="intro-banner" id="introBanner">
    <div class="intro-kicker" id="introKicker">TIEMPO FUERA • EN VIVO</div>
    <div class="intro-main" id="introMain">COMPETENCIA DE TRIPLES</div>
    <div class="intro-sub" id="introSub">RONDA CLASIFICATORIA</div>
  </div>

  <!-- Capa Marcador de Partido -->
  <div class="match-stage layer-fade layer-hidden" id="matchStage">
    <div class="match-top-tag" id="matchTopTag">TIEMPO FUERA</div>
    <div class="match-bar" id="matchBar">
      <div class="team-block">
        <div class="team-accent-bar" id="barColor1" style="background:#dc2626;"></div>
        <img id="liveLogo1" class="team-logo-img empty" alt="">
        <div class="team-text">
          <div class="team-name" id="liveName1">LOCAL</div>
          <div class="fouls-dots" id="liveFouls1"></div>
        </div>
      </div>

      <div class="score-box" id="liveScore1">0</div>

      <div class="clock-center">
        <div class="clock-period" id="livePeriod">Q1</div>
        <div class="clock-time" id="liveClock">10:00</div>
      </div>

      <div class="score-box" id="liveScore2">0</div>

      <div class="team-block right">
        <div class="team-accent-bar" id="barColor2" style="background:#2563eb;"></div>
        <img id="liveLogo2" class="team-logo-img empty" alt="">
        <div class="team-text">
          <div class="team-name" id="liveName2">VISITA</div>
          <div class="fouls-dots" id="liveFouls2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Capa Competencias Especiales (Triples y Tiros Libres) -->
  <div class="comp-stage layer-fade layer-hidden" id="compStage">
    <div class="match-top-tag" id="compTopTag">TIEMPO FUERA • COMPETENCIA ESPECIAL</div>
    <div class="comp-bar" id="compBar">
      <div class="comp-meta">
        <div class="comp-title" id="compTitle">COMPETENCIA DE TRIPLES</div>
        <div class="comp-round" id="compRound">PARTIDO 1</div>
        <div class="comp-leader" id="compLeaderBox">LÍDER: <span id="compLeaderText">-</span></div>
      </div>

      <div class="comp-player">
        <img id="compShooterLogo" class="comp-player-logo empty" alt="">
        <div>
          <div class="comp-player-name" id="compShooterName">ESPERANDO JUGADORA</div>
          <div class="comp-player-team" id="compShooterTeam">EN CANCHA</div>
        </div>
      </div>

      <div class="comp-score-box">
        <small>PUNTOS</small>
        <div class="comp-score-val" id="compScoreVal">0</div>
      </div>

      <div class="comp-shots-box">
        <small id="compProgressLabel">LANZAMIENTOS: 0 / 6</small>
        <div class="bballs-strip" id="compBallsStrip"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    let matchData = { enabled: true, on: false, config: {}, feeds: {} };
    let specialsData = { active: false, compType: "triples", instanceId: "inst_1", bannerTs: 0, instances: {} };
    let lastBannerTs = 0;
    let bannerTimeout = null;
    let lastSocialTs = 0;
    let socialTimeout = null;

    function formatPeriodFiba(p) {
      const n = parseInt(String(p ?? "1").replace(/[^0-9]/g, ""), 10) || 1;
      return n <= 4 ? `Q${n}` : `OT${n - 4}`;
    }

    function readMatchField(field, altKeys = []) {
      const src = matchData.config?.sources?.[field] || "manual";
      const bucket = matchData.feeds?.[src] || {};
      for (const k of [field, ...altKeys]) {
        if (bucket[k] !== undefined && bucket[k] !== null && bucket[k] !== "") return bucket[k];
      }
      return matchData.feeds?.manual?.[field];
    }

    function renderFoulsDots(containerId, count) {
      const c = Math.max(0, Math.min(5, parseInt(count, 10) || 0));
      let html = "";
      for (let i = 1; i <= 5; i++) {
        const cls = i <= c ? (c >= 5 ? "foul-dot bonus" : "foul-dot active") : "foul-dot";
        html += `<span class="${cls}"></span>`;
      }
      document.getElementById(containerId).innerHTML = html;
    }

    function setOptionalImg(imgEl, src) {
      if (src) {
        imgEl.src = src;
        imgEl.classList.remove("empty");
      } else {
        imgEl.removeAttribute("src");
        imgEl.classList.add("empty");
      }
    }

    function renderAll() {
      const cfg = matchData.config || {};
      const accent = cfg.accentColor || "#e3b857";

      /* 1. Exclusividad entre Competencias Especiales y Marcador de Partido */
      const specialIsActive = Boolean(specialsData.active);
      const matchIsVisible = Boolean(matchData.on) && !specialIsActive;

      document.getElementById("matchStage").classList.toggle("layer-hidden", !matchIsVisible);
      document.getElementById("compStage").classList.toggle("layer-hidden", !specialIsActive);

      /* 2. Render Marcador de Partido */
      document.getElementById("matchBar").style.borderColor = accent;
      document.getElementById("matchTopTag").style.color = accent;
      document.getElementById("matchTopTag").textContent = cfg.tournamentName || "TIEMPO FUERA";
      document.getElementById("liveName1").textContent = cfg.name1 || "LOCAL";
      document.getElementById("liveName2").textContent = cfg.name2 || "VISITA";
      document.getElementById("barColor1").style.background = cfg.color1 || "#dc2626";
      document.getElementById("barColor2").style.background = cfg.color2 || "#2563eb";
      setOptionalImg(document.getElementById("liveLogo1"), cfg.logo1 || "");
      setOptionalImg(document.getElementById("liveLogo2"), cfg.logo2 || "");

      document.getElementById("liveScore1").textContent = parseInt(readMatchField("points_1", ["points1", "score_1"]) ?? 0, 10) || 0;
      document.getElementById("liveScore2").textContent = parseInt(readMatchField("points_2", ["points2", "score_2"]) ?? 0, 10) || 0;
      renderFoulsDots("liveFouls1", readMatchField("fouls_1", ["fouls1"]) ?? 0);
      renderFoulsDots("liveFouls2", readMatchField("fouls_2", ["fouls2"]) ?? 0);

      const tmr = String(readMatchField("timer") ?? "10:00");
      const clockEl = document.getElementById("liveClock");
      clockEl.textContent = tmr;
      clockEl.classList.toggle("clutch", tmr.split(":").length === 3);

      const per = readMatchField("period", ["moment"]) ?? 1;
      document.getElementById("livePeriod").textContent = formatPeriodFiba(per);
      document.getElementById("livePeriod").style.color = accent;

      /* 3. Render Competencias Especiales */
      const cType = specialsData.compType || "triples";
      const bucket = specialsData.instances?.[cType] || {};
      const inst = bucket[specialsData.instanceId] || Object.values(bucket)[0] || {};
      const isFt = cType === "tiros_libres";

      document.getElementById("compBar").style.borderColor = accent;
      document.getElementById("compTopTag").style.color = accent;
      document.getElementById("compTitle").style.color = accent;
      document.getElementById("compTitle").textContent = isFt ? "COMPETENCIA DE TIROS LIBRES" : "COMPETENCIA DE TRIPLES";
      document.getElementById("compRound").textContent = inst.name || (cfg.tournamentName || "RONDA EN VIVO");

      const shooters = inst.shooters || [];
      const activeShooter = specialsData.activeShooter || shooters.find((s) => s.id === inst.activeShooterId) || null;
      const turnShots = specialsData.turnShots || inst.turnShots || [];
      const maxShots = inst.rules?.shotsCount || (isFt ? 10 : 6);
      const turnScore = turnShots.reduce((acc, s) => acc + (s.pts || 0), 0);

      /* Líder o Ganador de la instancia */
      const scored = shooters.filter((s) => typeof s.score === "number");
      let leaderStr = "-";
      if (inst.winnerId) {
        const w = shooters.find((s) => s.id === inst.winnerId);
        if (w) leaderStr = `🏆 ${w.name} (${w.score})`;
      } else if (scored.length) {
        const best = [...scored].sort((a, b) => b.score - a.score)[0];
        leaderStr = `${best.name} (${best.score})`;
      }
      document.getElementById("compLeaderText").textContent = leaderStr;
      document.getElementById("compLeaderText").style.color = accent;

      if (activeShooter) {
        document.getElementById("compShooterName").textContent = activeShooter.name || "";
        document.getElementById("compShooterTeam").textContent = activeShooter.team || "EN CANCHA";
        setOptionalImg(document.getElementById("compShooterLogo"), activeShooter.logo || "");
      } else {
        document.getElementById("compShooterName").textContent = inst.winnerId ? "RONDA FINALIZADA" : "PRÓXIMA JUGADORA";
        document.getElementById("compShooterTeam").textContent = inst.name || "ESPERANDO TURNO";
        setOptionalImg(document.getElementById("compShooterLogo"), "");
      }

      document.getElementById("compScoreVal").textContent = turnScore;
      document.getElementById("compScoreVal").style.color = accent;
      document.getElementById("compProgressLabel").textContent = `LANZAMIENTOS: ${turnShots.length} / ${maxShots}`;

      document.getElementById("compBallsStrip").innerHTML = turnShots.map((s) => {
        if (s.type === "bonus") return `<div class="bball-icon bonus">+${s.pts}</div>`;
        if (s.hit) return `<div class="bball-icon hit">🏀</div>`;
        return `<div class="bball-icon miss">✕</div>`;
      }).join("");

      /* 4. Banner centrado de 10 segundos al activar competencia */
      if (specialIsActive && specialsData.bannerTs && specialsData.bannerTs !== lastBannerTs) {
        lastBannerTs = specialsData.bannerTs;
        const banner = document.getElementById("introBanner");
        banner.style.borderColor = accent;
        document.getElementById("introKicker").style.color = accent;
        document.getElementById("introMain").textContent = specialsData.bannerTitle || (isFt ? "COMPETENCIA DE TIROS LIBRES" : "COMPETENCIA DE TRIPLES");
        document.getElementById("introSub").textContent = inst.name || (cfg.tournamentName || "TIEMPO FUERA");
        banner.classList.add("visible");
        if (bannerTimeout) clearTimeout(bannerTimeout);
        bannerTimeout = setTimeout(() => {
          banner.classList.remove("visible");
        }, 10000);
      }
      if (!specialIsActive) {
        document.getElementById("introBanner").classList.remove("visible");
      }
    }

    onValue(ref(db, `${DB_PATH}/modules/marcadores`), (snap) => {
      if (!snap.exists()) return;
      const val = snap.val();
      matchData = {
        enabled: val.enabled !== false,
        on: Boolean(val.on),
        config: val.config || {},
        feeds: {
          manual: val.feeds?.manual || {},
          scoresight: { ...(val.liveData || {}), ...(val.feeds?.scoresight || {}) },
          flexyscore: val.feeds?.flexyscore || {}
        }
      };

      const cmd = val.cmd;
      if (cmd && cmd.action === "social_now" && cmd.ts && cmd.ts !== lastSocialTs) {
        lastSocialTs = cmd.ts;
        const toast = document.getElementById("socialToast");
        const cfg = matchData.config || {};
        toast.textContent = cmd.network === "yt"
          ? `▶ YouTube: ${cfg.ytHandle || "@tiempofuera_cl"}`
          : `📷 Instagram: ${cfg.igHandle || "@tiempofuera_cl"}`;
        toast.style.borderColor = cfg.accentColor || "#e3b857";
        toast.classList.add("visible");
        if (socialTimeout) clearTimeout(socialTimeout);
        socialTimeout = setTimeout(() => toast.classList.remove("visible"), 7000);
      }

      renderAll();
    });

    onValue(ref(db, `${DB_PATH}/modules/especiales/live`), (snap) => {
      if (!snap.exists()) return;
      specialsData = { ...specialsData, ...snap.val() };
      renderAll();
    });
  </script>
</body>
</html>
