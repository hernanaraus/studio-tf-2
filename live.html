<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Live Marcador — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      color: #ffffff;
    }

    .broadcast-root {
      position: relative;
      width: 1920px;
      height: 1080px;
      opacity: 0;
      transform: translateY(-16px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .broadcast-root.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Barra superior minimalista estilo broadcast */
    .top-scoreboard-wrap {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: stretch;
      height: 76px;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(14, 16, 22, 0.94);
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .team-block {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 22px;
      min-width: 390px;
    }
    .team-block.home {
      justify-content: space-between;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }
    .team-block.away {
      justify-content: space-between;
      flex-direction: row-reverse;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
    }

    .team-identity {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .team-block.away .team-identity {
      align-items: flex-end;
      text-align: right;
    }

    .team-name {
      font-size: 32px;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .fouls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }
    .fouls-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #b5bccb;
      text-transform: uppercase;
    }
    .foul-pip {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .foul-pip.active {
      background: #ef4444;
      border-color: #fca5a5;
    }
    .foul-pip.bonus.active {
      background: #f59e0b;
      border-color: #fde68a;
    }

    .team-score {
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      min-width: 68px;
      text-align: center;
    }

    .center-clock-block {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 22px;
      background: rgba(9, 11, 15, 0.96);
    }
    .period-badge {
      background: #dc2626;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }
    .clock-display {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      min-width: 138px;
      text-align: center;
    }
    .clock-display.clutch {
      color: #f87171;
    }

    /* Zócalo inferior discreto de redes */
    .social-bug {
      position: absolute;
      bottom: 44px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(14, 16, 22, 0.94);
      border-left: 5px solid #dc2626;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0 8px 8px 0;
      padding: 10px 22px;
      opacity: 0;
      transform: translateX(-24px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .social-bug.is-shown {
      opacity: 1;
      transform: translateX(0);
    }
    .social-net {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f87171;
      letter-spacing: 1px;
    }
    .social-handle {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div class="broadcast-root" id="broadcastRoot">
    <div class="top-scoreboard-wrap" id="scoreboardBar">
      <div class="team-block home" id="homeBlock">
        <div class="team-identity">
          <div class="team-name" id="homeName">LOCAL</div>
          <div class="fouls-row">
            <span class="fouls-label">Faltas</span>
            <span class="foul-pip" data-foul-pip="1"></span>
            <span class="foul-pip" data-foul-pip="1"></span>
            <span class="foul-pip" data-foul-pip="1"></span>
            <span class="foul-pip" data-foul-pip="1"></span>
            <span class="foul-pip bonus" data-foul-pip="1"></span>
          </div>
        </div>
        <div class="team-score" id="homeScore">0</div>
      </div>

      <div class="center-clock-block">
        <div class="period-badge" id="periodBadge">Q1</div>
        <div class="clock-display" id="clockDisplay">10:00</div>
      </div>

      <div class="team-block away" id="awayBlock">
        <div class="team-identity">
          <div class="team-name" id="awayName">VISITA</div>
          <div class="fouls-row">
            <span class="fouls-label">Faltas</span>
            <span class="foul-pip" data-foul-pip="2"></span>
            <span class="foul-pip" data-foul-pip="2"></span>
            <span class="foul-pip" data-foul-pip="2"></span>
            <span class="foul-pip" data-foul-pip="2"></span>
            <span class="foul-pip bonus" data-foul-pip="2"></span>
          </div>
        </div>
        <div class="team-score" id="awayScore">0</div>
      </div>
    </div>

    <div class="social-bug" id="socialBug">
      <span class="social-net" id="socialNet">INSTAGRAM</span>
      <span class="social-handle">@tiempofuera_cl</span>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    let socialTimer = null;

    function formatPeriodFiba(p) {
      const n = parseInt(String(p ?? "1").replace(/[^0-9]/g, ""), 10) || 1;
      return n <= 4 ? `Q${n}` : `OT${n - 4}`;
    }

    function isClutchClock(clockStr) {
      const str = String(clockStr || "").trim();
      const parts = str.split(":");
      if (parts.length === 3) return true;
      if (parts.length === 2) {
        const m = parseInt(parts[0], 10) || 0;
        const s = parseFloat(parts[1]) || 0;
        return m === 0 && s < 10;
      }
      return false;
    }

    function renderFouls(teamNum, count) {
      const n = Math.max(0, Math.min(5, parseInt(count, 10) || 0));
      document.querySelectorAll(`[data-foul-pip="${teamNum}"]`).forEach((pip, idx) => {
        pip.classList.toggle("active", idx < n);
      });
    }

    function readEffective(val, field, altKeys = []) {
      const src = val.config?.sources?.[field] || "manual";
      const bucket = val.feeds?.[src] || {};
      for (const k of [field, ...altKeys]) {
        if (bucket[k] !== undefined && bucket[k] !== null && bucket[k] !== "") {
          return bucket[k];
        }
      }
      return (val.feeds?.manual || {})[field];
    }

    function triggerSocial(network) {
      const bug = document.getElementById("socialBug");
      const netEl = document.getElementById("socialNet");
      netEl.textContent = network === "yt" ? "YOUTUBE" : "INSTAGRAM";
      bug.classList.add("is-shown");
      if (socialTimer) clearTimeout(socialTimer);
      socialTimer = setTimeout(() => {
        bug.classList.remove("is-shown");
      }, 6500);
    }

    onValue(ref(db, `${DB_PATH}/modules/marcadores`), (snap) => {
      if (!snap.exists()) return;
      const val = snap.val();

      const root = document.getElementById("broadcastRoot");
      const isVisible = val.enabled !== false && Boolean(val.on);
      root.classList.toggle("is-visible", isVisible);

      const cfg = val.config || {};
      document.getElementById("homeName").textContent = cfg.name1 || "LOCAL";
      document.getElementById("awayName").textContent = cfg.name2 || "VISITA";

      if (cfg.color1) {
        document.getElementById("homeBlock").style.background =
          `linear-gradient(90deg, ${cfg.color1}44 0%, transparent 100%)`;
      }
      if (cfg.color2) {
        document.getElementById("awayBlock").style.background =
          `linear-gradient(270deg, ${cfg.color2}44 0%, transparent 100%)`;
      }

      const pts1 = parseInt(readEffective(val, "points_1", ["points1", "score_1"]) ?? 0, 10) || 0;
      const pts2 = parseInt(readEffective(val, "points_2", ["points2", "score_2"]) ?? 0, 10) || 0;
      const f1 = parseInt(readEffective(val, "fouls_1", ["fouls1"]) ?? 0, 10) || 0;
      const f2 = parseInt(readEffective(val, "fouls_2", ["fouls2"]) ?? 0, 10) || 0;
      const per = readEffective(val, "period", ["moment"]) ?? 1;
      const clock = readEffective(val, "timer") ?? "10:00";

      document.getElementById("homeScore").textContent = pts1;
      document.getElementById("awayScore").textContent = pts2;
      renderFouls(1, f1);
      renderFouls(2, f2);

      document.getElementById("periodBadge").textContent = formatPeriodFiba(per);
      const clockEl = document.getElementById("clockDisplay");
      clockEl.textContent = clock;
      clockEl.classList.toggle("clutch", isClutchClock(clock));

      if (val.cmd?.action === "social_now" && val.cmd.ts) {
        const ageMs = Date.now() - Number(val.cmd.ts);
        if (ageMs >= 0 && ageMs < 4000) {
          triggerSocial(val.cmd.network);
        }
      }
    });
  </script>
</body>
</html>
