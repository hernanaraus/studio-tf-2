<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Concurso de Tiros Libres — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      color: #ffffff;
    }

    .scene-root {
      position: fixed;
      right: 48px;
      bottom: 40px;
      width: min(920px, 49vw);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }
    .scene-root.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 98px;
      border-radius: 12px;
      border-style: solid;
      border-width: 2px;
      overflow: hidden;
    }
    .card.has-texture::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 2px,
        transparent 2px,
        transparent 7px
      );
      pointer-events: none;
      z-index: 1;
    }

    .comp-col {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      min-width: 220px;
      flex-shrink: 0;
    }
    .comp-logo {
      object-fit: contain;
      display: none;
      flex-shrink: 0;
    }
    .comp-logo.has-img { display: block; }
    .comp-title {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.02;
    }
    .comp-stage {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 2px;
    }
    .target-pill {
      margin-top: 4px;
      display: inline-flex;
      gap: 5px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }

    .player-col {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      min-width: 0;
    }
    .team-logo-img {
      object-fit: contain;
      display: none;
      flex-shrink: 0;
    }
    .team-logo-img.has-img { display: block; }

    .cat-tag {
      display: inline-block;
      width: fit-content;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .competitor-name {
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.02;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .team-sub {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .shots-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
    .ball-dot {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      line-height: 1;
    }
    .ball-dot.normal { color: #111; }
    .ball-dot.money { background: #facc15; color: #111; border: 1px solid #fff; }
    .ball-dot.half { background: #22c55e; color: #111; }
    .ball-dot.miss { background: rgba(255, 255, 255, 0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.6); }

    .metric-col {
      position: relative;
      z-index: 2;
      padding: 0 15px;
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 94px;
      flex-shrink: 0;
    }
    .metric-col.pts { background: rgba(0, 0, 0, 0.28); }
    .metric-col.clk { min-width: 124px; }
    .m-lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: rgba(255, 255, 255, 0.72); text-transform: uppercase; }
    .m-val { font-weight: 800; line-height: 0.95; font-variant-numeric: tabular-nums; }
    .clk-val { font-size: 38px; color: #ffffff; }
    .clk-val.danger { color: #ef4444; }

    .rules-mode { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 14px 18px; width: 100%; }
    .rules-title { font-size: 20px; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
    .rules-txt { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.25; margin-top: 3px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="scene-root" id="sceneRoot">
    <div class="card" id="libresCard">
      <div id="activeView" style="display:flex;align-items:stretch;width:100%;">
        <div class="comp-col">
          <img class="comp-logo" id="compLogo" alt="">
          <div style="min-width:0;">
            <div class="comp-title" id="compTitle">TIROS LIBRES</div>
            <div class="comp-stage" id="compStage">ELIMINACIÓN DIRECTA</div>
            <div class="target-pill"><span style="opacity:.75;">META:</span> <span id="targetVal">0 PTS</span></div>
          </div>
        </div>

        <div class="player-col">
          <img class="team-logo-img" id="teamLogoImg" alt="">
          <div style="min-width:0;flex:1;">
            <span class="cat-tag" id="catTag">LIBRES</span>
            <div class="competitor-name" id="competitorName">JUGADOR</div>
            <div class="team-sub" id="teamSub">EQUIPO</div>
            <div class="shots-strip" id="shotsStrip"></div>
          </div>
        </div>

        <div class="metric-col pts">
          <span class="m-lbl">PUNTOS</span>
          <span class="m-val" id="scoreVal">0</span>
        </div>

        <div class="metric-col clk" id="clockBox">
          <span class="m-lbl" id="clockLabel">TIEMPO</span>
          <span class="m-val clk-val" id="clockVal">1:00.0</span>
        </div>
      </div>

      <div id="idleView" class="rules-mode hidden">
        <img class="comp-logo" id="idleLogo" alt="">
        <div style="min-width:0;flex:1;">
          <div class="rules-title" id="idleTitle">CONCURSO DE TIROS LIBRES</div>
          <div class="rules-txt" id="idleRules">Eliminación directa · Concurso de tiros libres.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    let modData = { config: {}, live: {} };

    function hexToRgba(hex, alpha = 0.95) {
      let h = (hex || "#14171f").replace("#", "");
      if (h.length === 3) h = h.split("").map((c) => c + c).join("");
      const r = parseInt(h.substring(0, 2), 16) || 20;
      const g = parseInt(h.substring(2, 4), 16) || 23;
      const b = parseInt(h.substring(4, 6), 16) || 31;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function shade(hex, pct) {
      hex = (hex || "#14171f").replace("#", "");
      if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
      let r = parseInt(hex.substring(0, 2), 16) || 0;
      let g = parseInt(hex.substring(2, 4), 16) || 0;
      let b = parseInt(hex.substring(4, 6), 16) || 0;
      if (pct >= 0) {
        r = Math.min(255, Math.floor(r + (255 - r) * pct));
        g = Math.min(255, Math.floor(g + (255 - g) * pct));
        b = Math.min(255, Math.floor(b + (255 - b) * pct));
      } else {
        const f = 1 + pct;
        r = Math.max(0, Math.floor(r * f));
        g = Math.max(0, Math.floor(g * f));
        b = Math.max(0, Math.floor(b * f));
      }
      return "#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    function renderScene() {
      const cfg = modData.config?.libres || {};
      const live = modData.live?.libres || {};

      const isVisible = Boolean(modData.config?.enabledLibres) && Boolean(live.visible);
      document.getElementById("sceneRoot").classList.toggle("is-visible", isVisible);

      const stroke = cfg.colorStroke || "#ef4444";
      const bgTop = hexToRgba(cfg.colorBg || "#14171f", 0.95);
      const bgBot = hexToRgba(shade(cfg.colorBg || "#14171f", -0.24), 0.98);
      const glowSize = Number(cfg.glowSize ?? 22);
      const glowColor = cfg.glowColor || stroke;
      const glowShadow = cfg.glowEnabled !== false && glowSize > 0
        ? `, 0 0 ${glowSize}px ${hexToRgba(glowColor, 0.55)}`
        : "";

      const card = document.getElementById("libresCard");
      card.style.borderColor = stroke;
      card.style.background = `linear-gradient(180deg, ${bgTop} 0%, ${bgBot} 100%)`;
      card.style.boxShadow = `0 14px 32px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.16)${glowShadow}`;
      card.classList.toggle("has-texture", cfg.textureEnabled !== false);

      const compLogoPx = `${Number(cfg.compLogoSize) || 58}px`;
      const logoSrc = modData.config?.compLogo || "";
      const compLogoEl = document.getElementById("compLogo");
      const idleLogoEl = document.getElementById("idleLogo");
      [compLogoEl, idleLogoEl].forEach((img) => {
        img.style.width = compLogoPx;
        img.style.height = compLogoPx;
        if (logoSrc) {
          img.src = logoSrc;
          img.classList.add("has-img");
        } else {
          img.classList.remove("has-img");
        }
      });

      const p = live.player;
      const activeView = document.getElementById("activeView");
      const idleView = document.getElementById("idleView");

      if (!p || !p.name) {
        activeView.classList.add("hidden");
        idleView.classList.remove("hidden");
        document.getElementById("idleTitle").style.color = stroke;
        document.getElementById("idleTitle").textContent = cfg.title || "CONCURSO DE TIROS LIBRES";
        document.getElementById("idleRules").textContent = cfg.rulesText || "Eliminación directa · Concurso de tiros libres.";
        return;
      }

      activeView.classList.remove("hidden");
      idleView.classList.add("hidden");

      document.getElementById("compTitle").style.color = stroke;
      document.getElementById("compTitle").textContent = cfg.title || "TIROS LIBRES";
      document.getElementById("compStage").textContent = cfg.stage || "ELIMINACIÓN DIRECTA";
      document.getElementById("targetVal").textContent = `${live.targetScore ?? 0} PTS`;

      const catTag = document.getElementById("catTag");
      catTag.style.background = stroke;
      catTag.textContent = p.cat || "LIBRES";

      const compNameEl = document.getElementById("competitorName");
      compNameEl.style.color = cfg.playerNameColor || "#ffffff";
      compNameEl.style.fontSize = `${Number(cfg.playerNameSize) || 32}px`;
      compNameEl.textContent = p.name;

      document.getElementById("teamSub").textContent = p.team || "";

      const teamLogoPx = `${Number(cfg.teamLogoSize) || 54}px`;
      const teamLogoImg = document.getElementById("teamLogoImg");
      teamLogoImg.style.width = teamLogoPx;
      teamLogoImg.style.height = teamLogoPx;
      if (live.teamLogo) {
        teamLogoImg.src = live.teamLogo;
        teamLogoImg.classList.add("has-img");
      } else {
        teamLogoImg.classList.remove("has-img");
      }

      const scoreVal = document.getElementById("scoreVal");
      scoreVal.style.color = cfg.colorScore || "#f87171";
      scoreVal.style.fontSize = `${Number(cfg.scoreSize) || 44}px`;
      scoreVal.textContent = live.score ?? 0;

      const shots = live.shots || [];
      const clockBox = document.getElementById("clockBox");
      const clockVal = document.getElementById("clockVal");
      if (cfg.useTimer === false) {
        if (Number(cfg.maxShots) > 0) {
          clockBox.classList.remove("hidden");
          document.getElementById("clockLabel").textContent = "TIROS";
          clockVal.textContent = `${shots.length}/${cfg.maxShots}`;
          clockVal.classList.remove("danger");
        } else {
          clockBox.classList.add("hidden");
        }
      } else {
        clockBox.classList.remove("hidden");
        document.getElementById("clockLabel").textContent = "TIEMPO";
        clockVal.textContent = live.clockText || "1:00.0";
        clockVal.classList.toggle("danger", Boolean(live.isDangerTime));
      }

      const shotPx = Number(cfg.shotSize) || 20;
      const shotColor = cfg.colorShot || "#e3b857";
      document.getElementById("shotsStrip").innerHTML = shots.map((s) => {
        const baseStyle = `width:${shotPx}px;height:${shotPx}px;font-size:${Math.max(10, Math.round(shotPx * 0.52))}px;`;
        if (s.type === "normal") return `<span class="ball-dot normal" style="${baseStyle}background:${shotColor};">+${s.pts}</span>`;
        if (s.type === "money") return `<span class="ball-dot money" style="${baseStyle}">+${s.pts}</span>`;
        if (s.type === "half") return `<span class="ball-dot half" style="${baseStyle}">+${s.pts}</span>`;
        return `<span class="ball-dot miss" style="${baseStyle}">✕</span>`;
      }).join("");
    }

    onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
      if (!snap.exists()) return;
      const val = snap.val();
      modData = { config: val.config || {}, live: val.live || {} };
      renderScene();
    });
  </script>
</body>
</html>
