<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Overlay — Concurso de Tiros Libres</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Bebas+Neue&family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Barlow Condensed', sans-serif;
      color: #ffffff;
    }

    #overlayAnchor {
      position: fixed;
      left: 50%;
      top: 78%;
      width: min(920px, 49vw);
      max-width: 940px;
      transform-origin: top left;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    #overlayAnchor.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
    }

    .top-shadow-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 5px 10px;
    }
    .top-shadow-text {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.1px;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.92);
      text-transform: uppercase;
    }

    .main-card {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 102px;
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .main-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 2px,
        transparent 2px,
        transparent 7px
      );
      pointer-events: none;
    }

    .comp-col {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      width: 265px;
      flex-shrink: 0;
    }
    .comp-logo {
      width: auto;
      max-width: 76px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .comp-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .comp-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.02;
      text-transform: uppercase;
    }
    .comp-stage {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
      text-transform: uppercase;
    }
    .target-pill {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      padding: 2px 8px;
      width: fit-content;
    }
    .target-lbl {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.72);
    }
    .target-val {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    .player-col {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      min-width: 0;
    }
    .team-logo {
      object-fit: contain;
      flex-shrink: 0;
    }
    .player-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }
    .cat-badge {
      display: inline-block;
      width: fit-content;
      color: #111111;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .player-name-block {
      display: flex;
      flex-direction: column;
      line-height: 0.94;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .player-first-name {
      font-size: 31px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
    .player-last-name {
      font-size: 23px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.4px;
    }
    .player-team-sub {
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
      text-transform: uppercase;
      margin-top: 2px;
    }
    .shots-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .ball-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }
    .ball-dot.hit {
      background: radial-gradient(circle at 35% 30%, #ff9f43, #d35400 72%);
      border: 1.5px solid #1a0d00;
      color: #1a0d00;
    }
    .ball-dot.miss {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 90, 90, 0.8);
      color: #ff5a5a;
    }
    .ball-dot.money {
      background: radial-gradient(circle at 35% 30%, #fff3a1, #e3b857 65%, #9c6f14);
      border: 1.5px solid #ffffff;
      color: #111111;
    }
    .ball-dot.half {
      background: radial-gradient(circle at 35% 30%, #ff9f43, #c0392b 75%);
      border: 2px solid #ffe066;
      color: #ffffff;
    }

    .metric-col {
      position: relative;
      z-index: 2;
      padding: 0 15px;
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      flex-shrink: 0;
    }
    .metric-col.score-bg {
      background: rgba(0, 0, 0, 0.28);
    }
    .metric-col.clock-col {
      min-width: 128px;
    }
    .metric-lbl {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.74);
      text-transform: uppercase;
    }
    .metric-val {
      font-size: 44px;
      font-weight: 800;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }
    .clock-val {
      font-size: 40px;
      color: #ffffff;
    }
    .clock-val.is-low {
      color: #ff4d4f;
    }

    .idle-rules-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .idle-rules-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 2px,
        transparent 2px,
        transparent 7px
      );
      pointer-events: none;
    }
    .idle-logo {
      position: relative;
      z-index: 2;
      max-height: 82px;
      max-width: 96px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .idle-body {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1;
    }
    .idle-header-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .idle-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
    }
    .idle-stage-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      text-transform: uppercase;
    }
    .idle-rules-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      color: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 1100px) {
      #overlayAnchor {
        width: 94vw;
      }
    }
  </style>
</head>
<body>
  <div id="overlayAnchor" class="is-hidden"></div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    const anchor = document.getElementById("overlayAnchor");

    let sbCfg = {
      logoLiga: "",
      fontFamily: "'Barlow Condensed', sans-serif",
      accentColor: "#e3b857",
      clockBgColor: "#14171f",
      scoreTextColor: "#e3b857"
    };

    let especialesMod = {
      enabled: false,
      config: {},
      live: {}
    };

    function hexToRgba(hex, alphaPct = 92) {
      let h = (hex || "#14171f").replace("#", "");
      if (h.length === 3) h = h.split("").map((c) => c + c).join("");
      const r = parseInt(h.substring(0, 2), 16) || 20;
      const g = parseInt(h.substring(2, 4), 16) || 23;
      const b = parseInt(h.substring(4, 6), 16) || 31;
      const a = Math.max(0, Math.min(1, (parseInt(alphaPct, 10) || 92) / 100));
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function shade(hex, pct) {
      hex = (hex || "#14171f").replace("#", "");
      if (hex.length === 3) hex = hex.split("").map((c) => c + c).join("");
      let r = parseInt(hex.substring(0, 2), 16) || 0;
      let g = parseInt(hex.substring(2, 4), 16) || 0;
      let b = parseInt(hex.substring(4, 6), 16) || 0;
      if (pct >= 0) {
        r = Math.min(255, Math.floor(r + (255 - r) * pct));
        g = Math.min(255, Math.floor(g + (255 - g) * pct));
        b = Math.min(255, Math.floor(b + (255 - b) * pct));
      } else {
        const f = 1 + pct;
        r = Math.max(0, Math.floor(r * f));
        g = Math.max(0, Math.floor(g * f));
        b = Math.max(0, Math.floor(b * f));
      }
      return "#" + [r, g, b].map((x) => x.toString(16).padStart(2, "0")).join("");
    }

    function splitPlayerName(fullName) {
      const clean = String(fullName || "").trim();
      if (!clean) return { first: "", last: "" };
      const parts = clean.split(/\s+/);
      if (parts.length === 1) return { first: parts[0], last: "" };
      return {
        first: parts[0],
        last: parts.slice(1).join(" ")
      };
    }

    function formatClockTenth(sec) {
      const s = Math.max(0, Number(sec) || 0);
      const m = Math.floor(s / 60);
      const r = (s % 60).toFixed(1).padStart(4, "0");
      return `${m}:${r}`;
    }

    function renderOverlay() {
      const rootCfg = especialesMod.config || {};
      const cfg = rootCfg.libres || {};
      const live = especialesMod.live?.libres || {};

      const isEnabled = Boolean(especialesMod.enabled) && Boolean(rootCfg.enabledLibres);
      if (!isEnabled) {
        anchor.classList.add("is-hidden");
        return;
      }
      anchor.classList.remove("is-hidden");

      const posX = cfg.posX ?? 50.0;
      const posY = cfg.posY ?? 78.0;
      const scale = Math.min(1, (cfg.scale ?? 100) / 100);
      const fontFamily = rootCfg.fontFamily || sbCfg.fontFamily || "'Barlow Condensed', sans-serif";

      anchor.style.left = `${posX}%`;
      anchor.style.top = `${posY}%`;
      anchor.style.transform = `scale(${scale})`;
      anchor.style.fontFamily = fontFamily;

      const bgBase = cfg.colorBg || sbCfg.clockBgColor || "#14171f";
      const bgRgba = hexToRgba(bgBase, cfg.bgAlpha ?? 92);
      const bgDark = hexToRgba(shade(bgBase, -0.22), Math.min(100, (cfg.bgAlpha ?? 92) + 4));
      const accent = cfg.colorAccent || sbCfg.accentColor || "#e3b857";
      const scoreColor = cfg.colorScore || sbCfg.scoreTextColor || "#e3b857";
      const compLogo = cfg.compLogo || rootCfg.compLogo || sbCfg.logoLiga || "";
      const topShadowText = cfg.topShadowText || "TIEMPO FUERA · TRANSMISIÓN OFICIAL";

      const players = Array.isArray(cfg.players) ? cfg.players : [];
      const activePlayer = players.find((p) => String(p.id) === String(live.playerId));

      /* MODO SIN JUGADOR SELECCIONADO: LOGO DEL TORNEO + REGLAS */
      if (!activePlayer) {
        const rulesText = cfg.rulesText || "Concurso de Tiros Libres · Esperando siguiente participante.";
        const stageTag = [cfg.stage, cfg.categoryLabel].filter(Boolean).join(" · ");

        anchor.innerHTML = `
          <div class="top-shadow-bar">
            <span class="top-shadow-text">${topShadowText}</span>
          </div>
          <div class="idle-rules-card" style="background: linear-gradient(180deg, ${bgRgba} 0%, ${bgDark} 100%); border: 2px solid ${accent};">
            ${compLogo ? `<img src="${compLogo}" class="idle-logo" alt="Logo Torneo">` : ""}
            <div class="idle-body">
              <div class="idle-header-line">
                <span class="idle-title" style="color: ${accent};">${cfg.title || "CONCURSO DE TIROS LIBRES"}</span>
                ${stageTag ? `<span class="idle-stage-pill">${stageTag}</span>` : ""}
              </div>
              <div class="idle-rules-text">${rulesText}</div>
            </div>
          </div>
        `;
        return;
      }

      /* MODO CON JUGADOR ACTIVO */
      const nameParts = splitPlayerName(activePlayer.name);
      const teamLogo = cfg.teamLogos?.[activePlayer.team] || "";
      const targetPts = Number(cfg.targetOverride) > 0
        ? Number(cfg.targetOverride)
        : Math.max(0, ...players.map((p) => Number(p.bestScore) || 0));

      const shots = Array.isArray(live.shots) ? live.shots : [];
      const shotsHtml = shots.slice(-14).map((s) => {
        if (s.type === "miss") return `<span class="ball-dot miss">✕</span>`;
        if (s.type === "money") return `<span class="ball-dot money">${s.pts || cfg.ptsMoney || 2}</span>`;
        if (s.type === "half") return `<span class="ball-dot half">${s.pts || cfg.ptsHalf || 3}</span>`;
        return `<span class="ball-dot hit">🏀</span>`;
      }).join("");

      const useTimer = cfg.useTimer !== false;
      const clockSec = Number(live.clockSec ?? cfg.officialSec ?? 60);
      const timeColHtml = useTimer
        ? `<div class="metric-col clock-col">
            <span class="metric-lbl">TIEMPO</span>
            <span class="metric-val clock-val ${clockSec <= 5 && clockSec > 0 ? "is-low" : ""}">${formatClockTenth(clockSec)}</span>
          </div>`
        : (Number(cfg.maxShots) > 0
            ? `<div class="metric-col">
                <span class="metric-lbl">TIROS</span>
                <span class="metric-val" style="font-size:36px;color:#ffffff;">${shots.length}/${cfg.maxShots}</span>
              </div>`
            : "");

      const roundBadge = live.roundMode === "DESEMPATE" ? " · DESEMPATE" : "";

      anchor.innerHTML = `
        <div class="top-shadow-bar">
          <span class="top-shadow-text">${topShadowText}</span>
        </div>
        <div class="main-card" style="background: linear-gradient(180deg, ${bgRgba} 0%, ${bgDark} 100%); border: 2px solid ${accent};">
          <div class="comp-col">
            ${compLogo ? `<img src="${compLogo}" class="comp-logo" style="height:${cfg.compLogoSize || 62}px;" alt="Logo">` : ""}
            <div class="comp-meta">
              <span class="comp-title" style="color:${accent};">${cfg.title || "CONCURSO DE TIROS LIBRES"}</span>
              <span class="comp-stage">${(cfg.stage || "") + roundBadge}</span>
              <div class="target-pill">
                <span class="target-lbl">A SUPERAR:</span>
                <span class="target-val">${targetPts} PTS</span>
              </div>
            </div>
          </div>

          <div class="player-col">
            ${teamLogo ? `<img src="${teamLogo}" class="team-logo" style="height:${cfg.teamLogoSize || 48}px;width:${cfg.teamLogoSize || 48}px;" alt="Equipo">` : ""}
            <div class="player-info">
              <span class="cat-badge" style="background:${accent};">${activePlayer.cat || cfg.categoryLabel || "COMPETIDOR"}</span>
              <div class="player-name-block">
                <span class="player-first-name">${nameParts.first}</span>
                ${nameParts.last ? `<span class="player-last-name">${nameParts.last}</span>` : ""}
              </div>
              <span class="player-team-sub">${activePlayer.team}${activePlayer.pos ? ` · ${activePlayer.pos}` : ""}</span>
              ${shotsHtml ? `<div class="shots-row">${shotsHtml}</div>` : ""}
            </div>
          </div>

          <div class="metric-col score-bg">
            <span class="metric-lbl">PUNTOS</span>
            <span class="metric-val" style="color:${scoreColor};">${Number(live.score) || 0}</span>
          </div>

          ${timeColHtml}
        </div>
      `;
    }

    onValue(ref(db, `${DB_PATH}/modules/marcadores/config`), (snap) => {
      if (snap.exists()) {
        sbCfg = { ...sbCfg, ...snap.val() };
        renderOverlay();
      }
    });

    onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
      if (snap.exists()) {
        especialesMod = snap.val() || { enabled: false, config: {}, live: {} };
        renderOverlay();
      }
    });
  </script>
</body>
</html>
