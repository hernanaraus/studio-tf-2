<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Concurso de Tiros Libres — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      color: #ffffff;
    }

    .scene-root {
      position: fixed;
      right: 48px;
      bottom: 40px;
      width: min(920px, 49vw);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }
    .scene-root.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 98px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(20, 23, 31, 0.96) 0%, rgba(11, 13, 19, 0.98) 100%);
      border: 2px solid #ef4444;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .comp-col {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      width: 255px;
      flex-shrink: 0;
    }
    .comp-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      display: none;
      flex-shrink: 0;
    }
    .comp-logo.has-img { display: block; }
    .comp-title {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      color: #f87171;
      line-height: 1.02;
    }
    .comp-stage {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 2px;
    }
    .target-pill {
      margin-top: 4px;
      display: inline-flex;
      gap: 5px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 800;
      width: fit-content;
    }

    .player-col {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      min-width: 0;
    }
    .team-logo-box {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
    }
    .team-logo-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .team-logo-box img.has-img { display: block; }
    .team-logo-fallback { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.65); }

    .cat-tag {
      display: inline-block;
      width: fit-content;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .name-stack { display: flex; flex-direction: column; line-height: 0.94; text-transform: uppercase; margin-top: 2px; }
    .first-name { font-size: 30px; font-weight: 800; color: #fff; }
    .last-name { font-size: 22px; font-weight: 700; color: rgba(255, 255, 255, 0.9); }
    .team-sub { font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, 0.75); text-transform: uppercase; margin-top: 2px; }

    .shots-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .ball-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }
    .ball-dot.normal { background: #e3b857; color: #111; }
    .ball-dot.money { background: #facc15; color: #111; border: 1px solid #fff; }
    .ball-dot.half { background: #22c55e; color: #111; }
    .ball-dot.miss { background: rgba(255, 255, 255, 0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.6); }

    .metric-col {
      padding: 0 15px;
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 94px;
      flex-shrink: 0;
    }
    .metric-col.pts { background: rgba(0, 0, 0, 0.28); }
    .metric-col.clk { min-width: 124px; }
    .m-lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: rgba(255, 255, 255, 0.72); text-transform: uppercase; }
    .m-val { font-size: 42px; font-weight: 800; line-height: 0.95; font-variant-numeric: tabular-nums; color: #f87171; }
    .clk-val { font-size: 38px; color: #ffffff; }
    .clk-val.danger { color: #ef4444; }

    .rules-mode { display: flex; align-items: center; gap: 14px; padding: 14px 18px; width: 100%; }
    .rules-title { font-size: 20px; font-weight: 800; text-transform: uppercase; color: #f87171; line-height: 1.05; }
    .rules-txt { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.25; margin-top: 3px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="scene-root" id="sceneRoot">
    <div class="card" id="libresCard">
      <div id="activeView" style="display:flex;align-items:stretch;width:100%;">
        <div class="comp-col">
          <img class="comp-logo" id="compLogo" alt="">
          <div style="min-width:0;">
            <div class="comp-title" id="compTitle">TIROS LIBRES</div>
            <div class="comp-stage" id="compStage">CLASIFICATORIA</div>
            <div class="target-pill"><span style="opacity:.75;">META:</span> <span id="targetVal">0 PTS</span></div>
          </div>
        </div>

        <div class="player-col">
          <div class="team-logo-box">
            <img id="teamLogoImg" alt="">
            <span class="team-logo-fallback" id="teamLogoText">TL</span>
          </div>
          <div style="min-width:0;flex:1;">
            <span class="cat-tag" id="catTag">LIBRES</span>
            <div class="name-stack">
              <span class="first-name" id="firstName">JUGADOR</span>
              <span class="last-name" id="lastName"></span>
            </div>
            <div class="team-sub" id="teamSub">EQUIPO</div>
            <div class="shots-strip" id="shotsStrip"></div>
          </div>
        </div>

        <div class="metric-col pts">
          <span class="m-lbl">PUNTOS</span>
          <span class="m-val" id="scoreVal">0</span>
        </div>

        <div class="metric-col clk" id="clockBox">
          <span class="m-lbl" id="clockLabel">TIEMPO</span>
          <span class="m-val clk-val" id="clockVal">1:00.0</span>
        </div>
      </div>

      <div id="idleView" class="rules-mode hidden">
        <img class="comp-logo" id="idleLogo" alt="">
        <div style="min-width:0;flex:1;">
          <div class="rules-title" id="idleTitle">CONCURSO DE TIROS LIBRES</div>
          <div class="rules-txt" id="idleRules">Reglas del concurso de tiros libres.</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    let modData = { config: {}, live: {} };

    function splitName(full) {
      const clean = String(full || "").trim();
      if (!clean) return { first: "", last: "" };
      const parts = clean.split(/\s+/);
      if (parts.length === 1) return { first: parts[0], last: "" };
      return { first: parts[0], last: parts.slice(1).join(" ") };
    }

    function renderScene() {
      const cfg = modData.config?.libres || {};
      const live = modData.live?.libres || {};

      const isVisible = Boolean(modData.config?.enabledLibres) && Boolean(live.visible);
      document.getElementById("sceneRoot").classList.toggle("is-visible", isVisible);

      const accent = cfg.colorAccent || "#ef4444";
      const card = document.getElementById("libresCard");
      card.style.borderColor = accent;

      const logoSrc = modData.config?.compLogo || "";
      const compLogoEl = document.getElementById("compLogo");
      const idleLogoEl = document.getElementById("idleLogo");
      [compLogoEl, idleLogoEl].forEach((img) => {
        if (logoSrc) {
          img.src = logoSrc;
          img.classList.add("has-img");
        } else {
          img.classList.remove("has-img");
        }
      });

      const p = live.player;
      const activeView = document.getElementById("activeView");
      const idleView = document.getElementById("idleView");

      if (!p || !p.name) {
        activeView.classList.add("hidden");
        idleView.classList.remove("hidden");
        document.getElementById("idleTitle").style.color = accent;
        document.getElementById("idleTitle").textContent = cfg.title || "CONCURSO DE TIROS LIBRES";
        document.getElementById("idleRules").textContent = cfg.rulesText || "Concurso de tiros libres en vivo.";
        return;
      }

      activeView.classList.remove("hidden");
      idleView.classList.add("hidden");

      document.getElementById("compTitle").style.color = accent;
      document.getElementById("compTitle").textContent = cfg.title || "TIROS LIBRES";
      document.getElementById("compStage").textContent = cfg.stage || "";
      document.getElementById("targetVal").textContent = `${live.targetScore ?? 0} PTS`;

      const catTag = document.getElementById("catTag");
      catTag.style.background = accent;
      catTag.textContent = p.cat || "LIBRES";

      const np = splitName(p.name);
      document.getElementById("firstName").textContent = np.first;
      document.getElementById("lastName").textContent = np.last;
      document.getElementById("teamSub").textContent = p.team || "";

      const teamLogoImg = document.getElementById("teamLogoImg");
      const teamLogoText = document.getElementById("teamLogoText");
      if (live.teamLogo) {
        teamLogoImg.src = live.teamLogo;
        teamLogoImg.classList.add("has-img");
        teamLogoText.classList.add("hidden");
      } else {
        teamLogoImg.classList.remove("has-img");
        teamLogoText.textContent = (p.team || "TL").slice(0, 3);
        teamLogoText.classList.remove("hidden");
      }

      const scoreVal = document.getElementById("scoreVal");
      scoreVal.style.color = accent;
      scoreVal.textContent = live.score ?? 0;

      const shots = live.shots || [];
      const clockBox = document.getElementById("clockBox");
      const clockVal = document.getElementById("clockVal");
      if (cfg.useTimer === false) {
        if (Number(cfg.maxShots) > 0) {
          clockBox.classList.remove("hidden");
          document.getElementById("clockLabel").textContent = "TIROS";
          clockVal.textContent = `${shots.length}/${cfg.maxShots}`;
          clockVal.classList.remove("danger");
        } else {
          clockBox.classList.add("hidden");
        }
      } else {
        clockBox.classList.remove("hidden");
        document.getElementById("clockLabel").textContent = "TIEMPO";
        clockVal.textContent = live.clockText || "1:00.0";
        clockVal.classList.toggle("danger", Boolean(live.isDangerTime));
      }

      document.getElementById("shotsStrip").innerHTML = shots.map((s) => {
        if (s.type === "normal") return `<span class="ball-dot normal">+${s.pts}</span>`;
        if (s.type === "money") return `<span class="ball-dot money">+${s.pts}</span>`;
        if (s.type === "half") return `<span class="ball-dot half">+${s.pts}</span>`;
        return `<span class="ball-dot miss">✕</span>`;
      }).join("");
    }

    onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
      if (!snap.exists()) return;
      const val = snap.val();
      modData = { config: val.config || {}, live: val.live || {} };
      renderScene();
    });
  </script>
</body>
</html>
