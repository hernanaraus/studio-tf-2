<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Live Tiros Libres — Studio TF 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      color: #ffffff;
    }

    .scene-root {
      position: relative;
      width: 1920px;
      height: 1080px;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .scene-root.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .libres-banner {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 44px;
      display: grid;
      grid-template-columns: auto 1.45fr auto auto auto;
      align-items: center;
      gap: 22px;
      background: rgba(16, 19, 26, 0.95);
      border: 2px solid rgba(56, 189, 248, 0.55);
      border-radius: 12px;
      padding: 16px 26px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }

    .comp-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-right: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }
    .comp-logo {
      width: 66px;
      height: 66px;
      object-fit: contain;
      display: none;
    }
    .comp-logo.has-img { display: block; }
    .comp-title {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      color: #38bdf8;
      letter-spacing: 0.6px;
      line-height: 1.05;
    }
    .comp-stage {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      color: #cbd5e1;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    .player-section {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }
    .team-logo-box {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      flex-shrink: 0;
    }
    .team-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .team-logo-box img.has-img { display: block; }
    .team-logo-fallback {
      font-size: 14px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .player-name {
      font-size: 42px;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-sub {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    .shots-strip {
      display: flex;
      flex-wrap: wrap;
      max-width: 310px;
      gap: 6px;
      align-items: center;
    }
    .ball-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
    }
    .ball-dot.normal { background: #0284c7; color: #fff; }
    .ball-dot.money { background: #facc15; color: #111; }
    .ball-dot.half { background: #16a34a; color: #fff; }
    .ball-dot.miss { background: rgba(255, 255, 255, 0.12); color: #94a3b8; }

    .stat-box {
      text-align: center;
      background: rgba(10, 12, 17, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 8px 18px;
      min-width: 126px;
    }
    .stat-box small {
      display: block;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
    }
    .clock-val {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }
    .clock-val.danger { color: #ef4444; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="scene-root" id="sceneRoot">
    <div class="libres-banner" id="libresBanner">
      <div class="comp-brand">
        <img class="comp-logo" id="compLogo" alt="">
        <div>
          <div class="comp-title" id="compTitle">TIROS LIBRES</div>
          <div class="comp-stage" id="compStage">CLASIFICATORIA</div>
        </div>
      </div>

      <div class="player-section">
        <div class="team-logo-box">
          <img id="teamLogoImg" alt="">
          <span class="team-logo-fallback" id="teamLogoText">TL</span>
        </div>
        <div>
          <div class="player-name" id="playerName">ESPERANDO JUGADOR</div>
          <div class="player-sub" id="playerSub">SUPERAR: 0 PTS</div>
        </div>
      </div>

      <div class="shots-strip" id="shotsStrip"></div>

      <div class="stat-box">
        <small>Puntaje</small>
        <div class="stat-val" id="scoreVal">0</div>
      </div>

      <div class="stat-box" id="clockBox">
        <small id="clockLabel">Tiempo</small>
        <div class="clock-val" id="clockVal">1:00.0</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, DB_PATH, ref, onValue } from "./js/firebase.js";

    let modData = { config: {}, live: {} };

    function renderScene() {
      const cfg = modData.config?.libres || {};
      const live = modData.live?.libres || {};

      const isVisible = modData.config?.enabledLibres !== false && Boolean(live.visible);
      document.getElementById("sceneRoot").classList.toggle("is-visible", isVisible);

      document.getElementById("compTitle").textContent = cfg.title || "CONCURSO DE TIROS LIBRES";
      document.getElementById("compStage").textContent = cfg.stage || "";

      const compLogoEl = document.getElementById("compLogo");
      if (modData.config?.compLogo) {
        compLogoEl.src = modData.config.compLogo;
        compLogoEl.classList.add("has-img");
      } else {
        compLogoEl.classList.remove("has-img");
      }

      const p = live.player || {};
      document.getElementById("playerName").textContent = p.name || "ESPERANDO JUGADOR";
      const target = live.targetScore ?? 0;
      const metaParts = [p.team, p.cat].filter(Boolean).join(" • ");
      document.getElementById("playerSub").textContent =
        `${metaParts ? `${metaParts}  |  ` : ""}A SUPERAR: ${target} PTS`;

      const teamLogoImg = document.getElementById("teamLogoImg");
      const teamLogoText = document.getElementById("teamLogoText");
      if (live.teamLogo) {
        teamLogoImg.src = live.teamLogo;
        teamLogoImg.classList.add("has-img");
        teamLogoText.classList.add("hidden");
      } else {
        teamLogoImg.classList.remove("has-img");
        teamLogoText.textContent = (p.team || "TL").slice(0, 3);
        teamLogoText.classList.remove("hidden");
      }

      document.getElementById("scoreVal").textContent = live.score ?? 0;

      const clockBox = document.getElementById("clockBox");
      const clockVal = document.getElementById("clockVal");
      if (cfg.useTimer === false) {
        if (Number(cfg.maxShots) > 0) {
          clockBox.classList.remove("hidden");
          document.getElementById("clockLabel").textContent = "Tiros";
          clockVal.textContent = `${(live.shots || []).length}/${cfg.maxShots}`;
          clockVal.classList.remove("danger");
        } else {
          clockBox.classList.add("hidden");
        }
      } else {
        clockBox.classList.remove("hidden");
        document.getElementById("clockLabel").textContent = "Tiempo";
        clockVal.textContent = live.clockText || "1:00.0";
        clockVal.classList.toggle("danger", Boolean(live.isDangerTime));
      }

      document.getElementById("shotsStrip").innerHTML = (live.shots || []).map((s) => {
        if (s.type === "normal") return `<span class="ball-dot normal">+${s.pts}</span>`;
        if (s.type === "money") return `<span class="ball-dot money">+${s.pts}</span>`;
        if (s.type === "half") return `<span class="ball-dot half">+${s.pts}</span>`;
        return `<span class="ball-dot miss">✕</span>`;
      }).join("");
    }

    onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
      if (!snap.exists()) return;
      const val = snap.val();
      modData = {
        config: val.config || {},
        live: val.live || {}
      };
      renderScene();
    });
  </script>
</body>
</html>
