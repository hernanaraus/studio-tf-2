<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control — Studio TF 2.0</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .ctrl-bar {
      height: 52px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .ctrl-grid {
      max-width: 1140px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 16px;
    }
    .ctrl-card { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
    .ctrl-card.is-on { border-color: var(--accent); }
    .pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--muted);
    }
    .ctrl-card.is-on .pill { background: var(--accent); color: #fff; }
    .sb-box {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
    }
    .sb-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .q-btn {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .q-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="ctrl-bar">
    <div style="font-weight: 800;">CONTROL <span style="color: var(--accent);">TF 2.0</span></div>
    <div style="display: flex; gap: 8px;">
      <button id="sync-btn" class="btn" style="background: #2563eb; padding: 7px 14px; font-size: 0.75rem;">SYNC</button>
      <button id="to-studio-btn" class="btn btn-ghost" style="padding: 7px 14px; font-size: 0.75rem;" onclick="location.href='studio.html'">Estudio</button>
      <button class="btn btn-ghost" style="padding: 7px 14px; font-size: 0.75rem;" onclick="location.href='index.html'">Inicio</button>
    </div>
  </header>

  <main id="ctrl-grid" class="ctrl-grid">
    <p style="color: var(--muted);">Conectando con el estudio...</p>
  </main>

  <script type="module">
    import { db, DB_PATH, ref, update, get, onValue, requireSession, emailToKey } from "./js/firebase.js";
    import { pushToFlexyscore } from "./js/flexyscore-api.js";

    const LABELS = {
      marcadores: "Marcadores",
      especiales: "Competencias Especiales",
      tercios: "Tercios Inferiores",
      sponsors: "Logos de Sponsors",
      auspiciadores: "Logos de Auspiciadores",
      cg: "Control de CG (Scroll)",
      equipos: "Presentación de Equipos",
      estadisticas: "Estadísticas"
    };

    const grid = document.getElementById("ctrl-grid");

    function getCurrentPoints(mod, srcMap) {
      const f1Src = srcMap.points_1 || "flexyscore";
      const f2Src = srcMap.points_2 || "flexyscore";
      const p1 = Number((mod.feeds?.[f1Src]?.points_1 ?? mod.liveData?.points_1 ?? 0)) || 0;
      const p2 = Number((mod.feeds?.[f2Src]?.points_2 ?? mod.liveData?.points_2 ?? 0)) || 0;
      return { p1, p2, f1Src, f2Src };
    }

    function renderMarcadorWidget(mod) {
      const cfg = mod.config || {};
      const src = cfg.sources || {};
      const { p1, p2, f1Src, f2Src } = getCurrentPoints(mod, src);

      return `
        <div class="sb-box">
          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem;">
            <span>${cfg.name1 || "LOCAL"}: ${p1}</span>
            <span>${cfg.name2 || "VISITA"}: ${p2}</span>
          </div>
          <div style="color:var(--muted); font-size:0.7rem; margin-top:4px;">
            Pts L: <strong>${f1Src}</strong> · Pts V: <strong>${f2Src}</strong> · Reloj: <strong>${src.timer || "scoresight"}</strong>
          </div>
          <div class="sb-row">
            <button class="q-btn" data-pts="1" data-d="1">+1 L</button>
            <button class="q-btn" data-pts="1" data-d="2">+2 L</button>
            <button class="q-btn" data-pts="1" data-d="3">+3 L</button>
            <button class="q-btn" data-pts="1" data-d="-1">-1 L</button>
            <button class="q-btn" data-pts="2" data-d="1">+1 V</button>
            <button class="q-btn" data-pts="2" data-d="2">+2 V</button>
            <button class="q-btn" data-pts="2" data-d="3">+3 V</button>
            <button class="q-btn" data-pts="2" data-d="-1">-1 V</button>
          </div>
          <div class="sb-row">
            <button class="q-btn" data-social="ig">📸 IG Now</button>
            <button class="q-btn" data-social="yt">▶️ YT Now</button>
          </div>
        </div>
      `;
    }

    function paint(data, allowedScope) {
      grid.innerHTML = "";
      if (!data) {
        grid.innerHTML = "<p style='color:var(--muted);'>No hay módulos habilitados en el Estudio.</p>";
        return;
      }

      let shown = 0;
      Object.entries(LABELS).forEach(([key, title]) => {
        if (allowedScope === "marcadores" && key !== "marcadores") return;
        const item = data[key];
        if (!item?.enabled) return;
        shown++;

        const isOn = Boolean(item.on);
        const card = document.createElement("article");
        card.className = `card ctrl-card ${isOn ? "is-on" : ""}`;
        card.innerHTML = `
          <div>
            <span class="pill">${isOn ? "ACTIVO EN LIVE" : "APAGADO"}</span>
            <h3 style="margin-top: 10px; font-size: 1.05rem;">${title}</h3>
          </div>
          ${key === "marcadores" ? renderMarcadorWidget(item) : ""}
          <button class="btn ${isOn ? "" : "btn-ghost"}" data-mod="${key}" data-on="${isOn}">
            ${isOn ? "APAGAR (OFF)" : "ENCENDER (ON)"}
          </button>
        `;
        grid.appendChild(card);
      });

      if (shown === 0) {
        grid.innerHTML = "<p style='color:var(--muted);'>Habilita módulos desde las pestañas del Estudio.</p>";
      }

      grid.querySelectorAll("button[data-mod]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const mod = btn.dataset.mod;
          const next = btn.dataset.on !== "true";
          await update(ref(db, `${DB_PATH}/modules/${mod}`), { on: next });
        });
      });

      grid.querySelectorAll("button[data-pts]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const team = btn.dataset.pts;
          const delta = parseInt(btn.dataset.d, 10);
          const mItem = data.marcadores || {};
          const cfg = mItem.config || {};
          const src = cfg.sources || {};
          const { p1, p2, f1Src, f2Src } = getCurrentPoints(mItem, src);

          const nextP1 = team === "1" ? Math.max(0, p1 + delta) : p1;
          const nextP2 = team === "2" ? Math.max(0, p2 + delta) : p2;
          const targetFeed = team === "1" ? f1Src : f2Src;
          const field = team === "1" ? "points_1" : "points_2";
          const nextVal = team === "1" ? nextP1 : nextP2;

          await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/${targetFeed}`), {
            [field]: nextVal
          });

          if ((f1Src === "flexyscore" || f2Src === "flexyscore") && cfg.flexyLiveId) {
            try {
              await pushToFlexyscore(cfg.flexyLiveId, {
                points_1: nextP1,
                points_2: nextP2,
                generictoggle: 1
              });
            } catch (_) {}
          }
        });
      });

      grid.querySelectorAll("button[data-social]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await update(ref(db, `${DB_PATH}/modules/marcadores/cmd`), {
            action: "social_now",
            network: btn.dataset.social,
            ts: Date.now()
          });
        });
      });
    }

    requireSession(async (user, role) => {
      if (role !== "admin") {
        document.getElementById("to-studio-btn").style.display = "none";
      }

      let scope = "all";
      if (role === "control" && user.email) {
        const uSnap = await get(ref(db, `${DB_PATH}/controlUsers/${emailToKey(user.email)}`));
        if (uSnap.exists()) scope = uSnap.val().scope || "all";
      }

      const modulesRef = ref(db, `${DB_PATH}/modules`);
      onValue(modulesRef, (snap) => paint(snap.val(), scope));

      document.getElementById("sync-btn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.textContent = "SINCRONIZANDO...";
        const snap = await get(modulesRef);
        paint(snap.val(), scope);
        await update(ref(db, DB_PATH), { syncedAt: Date.now() });
        setTimeout(() => { btn.textContent = "SYNC"; }, 700);
      });
    });
  </script>
</body>
</html>
