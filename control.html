<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control en Vivo — Studio TF 2.0</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .ctrl-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ctrl-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .ctrl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }
    .ctrl-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ctrl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .ctrl-head h2 {
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .team-score-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .score-big {
      font-size: 2.3rem;
      font-weight: 900;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 8px 11px;
      font-size: 0.78rem;
    }
    .btn-on {
      background: var(--ok);
      color: #fff;
    }
    .btn-on:hover {
      background: #15803d;
    }
    .clock-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .clock-row input,
    .clock-row select {
      background: var(--bg-app);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .sp-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 7px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 0.84rem;
    }
    .sp-item.is-active {
      border-color: var(--accent);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="ctrl-topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="font-weight:900; letter-spacing:1px; cursor:pointer;" onclick="location.href='index.html'">
        STUDIO <span style="color:var(--accent);">TF 2.0</span> · CONTROL
      </div>
      <span id="roleBadge" style="font-size:0.75rem; color:var(--muted); font-weight:700;"></span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" id="toggleMarcadorBtn" class="btn btn-sm">Marcador: OFF</button>
      <button type="button" id="studioLinkBtn" class="btn btn-ghost btn-sm hidden" onclick="location.href='studio.html'">Estudio</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="location.href='index.html'">Portal</button>
    </div>
  </header>

  <main class="ctrl-wrap">
    <!-- MARCADOR PRINCIPAL -->
    <section class="ctrl-card" id="cardMarcador">
      <div class="ctrl-head">
        <h2>Marcador de Partido</h2>
        <span id="matchTitle" style="font-size:0.82rem; color:var(--muted); font-weight:700;">LOCAL vs VISITA</span>
      </div>

      <div class="ctrl-grid">
        <!-- LOCAL -->
        <div class="team-score-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong id="labelTeam1" style="font-size:0.95rem; text-transform:uppercase;">LOCAL</strong>
            <span id="labelFouls1" style="font-size:0.8rem; color:var(--muted); font-weight:700;">Faltas: 0</span>
          </div>
          <div class="score-big" id="valPts1">0</div>
          <div class="btn-row">
            <button type="button" class="btn btn-sm" data-pts="1:1">+1</button>
            <button type="button" class="btn btn-sm" data-pts="1:2">+2</button>
            <button type="button" class="btn btn-sm" data-pts="1:3">+3</button>
            <button type="button" class="btn btn-ghost btn-sm" data-pts="1:-1">-1</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost btn-sm" data-foul="1:+1">+ Falta</button>
            <button type="button" class="btn btn-ghost btn-sm" data-foul="1:-1">- Falta</button>
          </div>
        </div>

        <!-- VISITA -->
        <div class="team-score-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong id="labelTeam2" style="font-size:0.95rem; text-transform:uppercase;">VISITA</strong>
            <span id="labelFouls2" style="font-size:0.8rem; color:var(--muted); font-weight:700;">Faltas: 0</span>
          </div>
          <div class="score-big" id="valPts2">0</div>
          <div class="btn-row">
            <button type="button" class="btn btn-sm" data-pts="2:1">+1</button>
            <button type="button" class="btn btn-sm" data-pts="2:2">+2</button>
            <button type="button" class="btn btn-sm" data-pts="2:3">+3</button>
            <button type="button" class="btn btn-ghost btn-sm" data-pts="2:-1">-1</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost btn-sm" data-foul="2:+1">+ Falta</button>
            <button type="button" class="btn btn-ghost btn-sm" data-foul="2:-1">- Falta</button>
          </div>
        </div>
      </div>

      <!-- RELOJ Y CUARTO -->
      <div class="clock-row">
        <input type="text" id="inTimer" value="10:00" style="width:90px; text-align:center;">
        <button type="button" id="applyTimerBtn" class="btn btn-ghost btn-sm">Set Reloj</button>
        <select id="selPeriod">
          <option value="1">Q1</option>
          <option value="2">Q2</option>
          <option value="3">Q3</option>
          <option value="4">Q4</option>
          <option value="5">OT1</option>
          <option value="6">OT2</option>
        </select>
        <button type="button" id="resetFoulsBtn" class="btn btn-ghost btn-sm">Limpiar Faltas</button>
      </div>
    </section>

    <!-- RRSS Y COMPETENCIAS ESPECIALES -->
    <div class="ctrl-grid">
      <section class="ctrl-card">
        <div class="ctrl-head">
          <h2>Redes Sociales</h2>
        </div>
        <div class="btn-row">
          <button type="button" id="sendIgBtn" class="btn btn-ghost btn-sm">Lanzar Instagram</button>
          <button type="button" id="sendYtBtn" class="btn btn-ghost btn-sm">Lanzar YouTube</button>
        </div>
      </section>

      <section class="ctrl-card hidden" id="cardEspeciales">
        <div class="ctrl-head">
          <h2>Competencia Especial</h2>
          <button type="button" id="toggleEspecialBtn" class="btn btn-sm">Lanzar en Live</button>
        </div>

        <div class="clock-row">
          <select id="spCompType">
            <option value="triples">Concurso de Triples</option>
            <option value="tiros_libres">Concurso de Tiros Libres</option>
          </select>
          <input type="text" id="spShooterName" placeholder="Nombre tirador" style="flex:1; min-width:130px;">
          <button type="button" id="addShooterBtn" class="btn btn-ghost btn-sm">+ Tirador</button>
        </div>

        <div class="btn-row">
          <button type="button" class="btn btn-sm" data-shot="hit">🏀 Encesta</button>
          <button type="button" class="btn btn-ghost btn-sm" data-shot="miss">✕ Falla</button>
          <button type="button" class="btn btn-ghost btn-sm" id="finishTurnBtn">Guardar Turno</button>
          <button type="button" class="btn btn-ghost btn-sm" id="closeRoundBtn">Cerrar Ronda</button>
        </div>

        <div class="sp-list" id="spShootersList"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { db, DB_PATH, ref, update, onValue, requireSession } from "./js/firebase.js";

    let marcMod = {
      on: false,
      config: { name1: "LOCAL", name2: "VISITA" },
      feeds: { manual: { points_1: 0, points_2: 0, fouls_1: 0, fouls_2: 0, timer: "10:00", period: 1 } }
    };

    let espMod = {
      enabled: false,
      config: {
        modules: ["triples", "tiros_libres"],
        rules: {
          triples: "5 racks de triples + balón dinero en cada rack. Máximo puntaje define el avance de ronda.",
          tiros_libres: "Turnos de tiros libres desde la línea. Mayor efectividad o desempate súbito define al ganador."
        }
      },
      live: {
        active: false,
        compType: "triples",
        shooters: [],
        activeId: null,
        turnShots: [],
        closed: false,
        winnerId: null,
        rulesText: "",
        bannerTitle: "",
        bannerTs: 0
      }
    };

    function getManual() {
      return {
        points_1: 0,
        points_2: 0,
        fouls_1: 0,
        fouls_2: 0,
        timer: "10:00",
        period: 1,
        ...(marcMod.feeds?.manual || {})
      };
    }

    function renderMarcadorUI() {
      const m = getManual();
      const n1 = marcMod.config?.name1 || "LOCAL";
      const n2 = marcMod.config?.name2 || "VISITA";

      document.getElementById("labelTeam1").textContent = n1;
      document.getElementById("labelTeam2").textContent = n2;
      document.getElementById("matchTitle").textContent = `${n1} vs ${n2}`;
      document.getElementById("valPts1").textContent = m.points_1;
      document.getElementById("valPts2").textContent = m.points_2;
      document.getElementById("labelFouls1").textContent = `Faltas: ${m.fouls_1}`;
      document.getElementById("labelFouls2").textContent = `Faltas: ${m.fouls_2}`;
      document.getElementById("inTimer").value = m.timer || "10:00";
      document.getElementById("selPeriod").value = String(m.period || 1);

      const btn = document.getElementById("toggleMarcadorBtn");
      btn.textContent = marcMod.on ? "Marcador: ON AIR" : "Marcador: OFF";
      btn.classList.toggle("btn-on", Boolean(marcMod.on));
    }

    function renderEspecialesUI() {
      document.getElementById("cardEspeciales").classList.toggle("hidden", !espMod.enabled);
      const live = espMod.live || {};
      const tBtn = document.getElementById("toggleEspecialBtn");
      tBtn.textContent = live.active ? "Ocultar en Live" : "Lanzar en Live";
      tBtn.classList.toggle("btn-on", Boolean(live.active));

      const shooters = live.shooters || [];
      const activeId = live.activeId;
      const listEl = document.getElementById("spShootersList");

      if (!shooters.length) {
        listEl.innerHTML = `<div style="color:var(--muted); font-size:0.8rem;">Agrega tiradores para iniciar la ronda.</div>`;
        return;
      }

      listEl.innerHTML = shooters.map((s) => `
        <div class="sp-item ${s.id === activeId ? "is-active" : ""}">
          <div>
            <strong>${s.name}</strong>
            <span style="color:var(--accent); font-weight:800; margin-left:8px;">${s.score ?? 0} pts</span>
            ${live.winnerId === s.id ? `<span style="color:#4ade80; font-weight:800; margin-left:6px;">GANADOR</span>` : ""}
          </div>
          <button type="button" class="btn btn-ghost btn-sm" data-pick="${s.id}">Turno</button>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-pick]").forEach((b) => {
        b.addEventListener("click", async () => {
          await update(ref(db, `${DB_PATH}/modules/especiales/live`), {
            activeId: b.dataset.pick,
            turnShots: []
          });
        });
      });
    }

    document.getElementById("toggleMarcadorBtn").addEventListener("click", async () => {
      await update(ref(db, `${DB_PATH}/modules/marcadores`), { on: !marcMod.on });
    });

    document.querySelectorAll("[data-pts]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const [team, deltaStr] = btn.dataset.pts.split(":");
        const delta = parseInt(deltaStr, 10);
        const m = getManual();
        const key = team === "1" ? "points_1" : "points_2";
        const nextVal = Math.max(0, (parseInt(m[key], 10) || 0) + delta);
        await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/manual`), { [key]: nextVal });
      });
    });

    document.querySelectorAll("[data-foul]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const [team, deltaStr] = btn.dataset.foul.split(":");
        const delta = parseInt(deltaStr, 10);
        const m = getManual();
        const key = team === "1" ? "fouls_1" : "fouls_2";
        const nextVal = Math.max(0, Math.min(5, (parseInt(m[key], 10) || 0) + delta));
        await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/manual`), { [key]: nextVal });
      });
    });

    document.getElementById("resetFoulsBtn").addEventListener("click", async () => {
      await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/manual`), { fouls_1: 0, fouls_2: 0 });
    });

    document.getElementById("applyTimerBtn").addEventListener("click", async () => {
      const val = document.getElementById("inTimer").value.trim() || "10:00";
      await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/manual`), { timer: val });
    });

    document.getElementById("selPeriod").addEventListener("change", async (e) => {
      await update(ref(db, `${DB_PATH}/modules/marcadores/feeds/manual`), { period: parseInt(e.target.value, 10) || 1 });
    });

    async function sendSocial(network) {
      await update(ref(db, `${DB_PATH}/modules/marcadores/cmd`), {
        action: "social_now",
        network,
        ts: Date.now()
      });
    }
    document.getElementById("sendIgBtn").addEventListener("click", () => sendSocial("ig"));
    document.getElementById("sendYtBtn").addEventListener("click", () => sendSocial("yt"));

    // Competencias Especiales — Operación rápida en vivo
    document.getElementById("toggleEspecialBtn").addEventListener("click", async () => {
      const live = espMod.live || {};
      const nextActive = !live.active;
      const compType = document.getElementById("spCompType").value || live.compType || "triples";
      const rulesMap = espMod.config?.rules || {};
      const bannerTitle = compType === "tiros_libres" ? "CONCURSO DE TIROS LIBRES" : "CONCURSO DE TRIPLES";
      const rulesText = rulesMap[compType] || "";

      await update(ref(db, `${DB_PATH}/modules/especiales/live`), {
        active: nextActive,
        compType,
        rulesText,
        ...(nextActive ? { bannerTitle, bannerTs: Date.now() } : {})
      });
    });

    document.getElementById("addShooterBtn").addEventListener("click", async () => {
      const inp = document.getElementById("spShooterName");
      const name = inp.value.trim();
      if (!name) return;
      const live = espMod.live || {};
      const shooters = [...(live.shooters || [])];
      const newId = `sh_${Date.now()}`;
      shooters.push({ id: newId, name, score: 0 });
      await update(ref(db, `${DB_PATH}/modules/especiales/live`), {
        shooters,
        activeId: live.activeId || newId,
        turnShots: live.activeId ? (live.turnShots || []) : []
      });
      inp.value = "";
    });

    document.querySelectorAll("[data-shot]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const isHit = btn.dataset.shot === "hit";
        const live = espMod.live || {};
        const turnShots = [...(live.turnShots || [])];
        const compType = live.compType || "triples";
        const shotPts = isHit ? (compType === "triples" ? 3 : 1) : 0;
        turnShots.push({ hit: isHit, pts: shotPts });
        await update(ref(db, `${DB_PATH}/modules/especiales/live`), { turnShots });
      });
    });

    document.getElementById("finishTurnBtn").addEventListener("click", async () => {
      const live = espMod.live || {};
      const shooters = [...(live.shooters || [])];
      const activeId = live.activeId;
      const turnPts = (live.turnShots || []).reduce((acc, s) => acc + (s.hit ? (s.pts || 1) : 0), 0);

      const idx = shooters.findIndex((s) => s.id === activeId);
      if (idx >= 0) {
        shooters[idx] = { ...shooters[idx], score: (shooters[idx].score || 0) + turnPts };
      }
      const nextShooter = shooters[(idx + 1) % shooters.length] || null;

      await update(ref(db, `${DB_PATH}/modules/especiales/live`), {
        shooters,
        activeId: nextShooter ? nextShooter.id : null,
        turnShots: []
      });
    });

    document.getElementById("closeRoundBtn").addEventListener("click", async () => {
      const live = espMod.live || {};
      const shooters = [...(live.shooters || [])];
      let winner = null;
      if (shooters.length) {
        winner = [...shooters].sort((a, b) => (b.score || 0) - (a.score || 0))[0];
      }
      await update(ref(db, `${DB_PATH}/modules/especiales/live`), {
        closed: true,
        winnerId: winner ? winner.id : null
      });
    });

    requireSession((user, role) => {
      document.getElementById("roleBadge").textContent = `${user.email} · ${role.toUpperCase()}`;
      if (role === "admin") {
        document.getElementById("studioLinkBtn").classList.remove("hidden");
      }

      onValue(ref(db, `${DB_PATH}/modules/marcadores`), (snap) => {
        if (!snap.exists()) return;
        marcMod = { ...marcMod, ...snap.val() };
        renderMarcadorUI();
      });

      onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
        if (!snap.exists()) return;
        espMod = { ...espMod, ...snap.val() };
        if (espMod.live?.compType) {
          document.getElementById("spCompType").value = espMod.live.compType;
        }
        renderEspecialesUI();
      });
    });
  </script>
</body>
</html>
