<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estudio — Studio TF 2.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Bebas+Neue&family=Chakra+Petch:wght@600;700&family=Oswald:wght@600;700&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-app: #0f1116;
      --bg-panel: #171a22;
      --bg-card: #1d212b;
      --border: #2c3242;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #e3b857;
    }

    body {
      margin: 0;
      background: var(--bg-app);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      font-size: 1rem;
    }
    .brand span { color: var(--accent); }

    .btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-gold {
      background: var(--accent);
      color: #111;
      border-color: var(--accent);
      font-weight: 800;
    }
    .btn-new-match {
      background: rgba(59, 130, 246, 0.2);
      border-color: #60a5fa;
      color: #bfdbfe;
      font-weight: 800;
    }
    .btn-new-match:hover {
      background: rgba(59, 130, 246, 0.34);
    }

    .studio-shell {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
      padding: 14px 16px;
      max-width: 1680px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .studio-shell { grid-template-columns: 1fr; }
    }

    .left-col {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .studio-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .s-tab {
      background: var(--bg-card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .s-tab.is-active {
      background: var(--accent);
      color: #111;
      border-color: var(--accent);
    }

    .pane {
      display: none;
      flex-direction: column;
      gap: 10px;
      max-height: 74vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .pane.is-active { display: flex; }

    .group-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .group-title {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 700;
    }
    .field input[type="text"],
    .field input[type="number"],
    .field select {
      background: var(--bg-app);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.78rem;
    }
    .field input[type="color"] {
      width: 100%;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-app);
      cursor: pointer;
      padding: 2px;
    }

    .check-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .stage-169 {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(45deg, #151821 25%, transparent 25%),
        linear-gradient(-45deg, #151821 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #151821 75%),
        linear-gradient(-45deg, transparent 75%, #151821 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      background-color: #10131a;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      user-select: none;
    }

    .drag-box {
      position: absolute;
      cursor: grab;
      z-index: 10;
      outline: 1px dashed rgba(227, 184, 87, 0.45);
    }
    .drag-box:active { cursor: grabbing; }

    .status-toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #14532d;
      border: 1px solid #4ade80;
      color: #dcfce7;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 60;
    }
    .status-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div class="brand" onclick="location.href='index.html'">STUDIO <span>TF 2.0</span> · ESTUDIO</div>
      <span id="liveStatusPill" style="font-size:0.74rem; font-weight:800; color:var(--muted);">Marcador: OFF AIR</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" id="newMatchBtn" class="btn btn-new-match">🆕 Nuevo Partido</button>
      <button type="button" id="saveAllBtn" class="btn btn-gold">💾 Guardar Cambios</button>
      <button type="button" class="btn" onclick="location.href='control.html'">Ir a Control</button>
      <button type="button" class="btn" onclick="location.href='index.html'">Inicio</button>
    </div>
  </header>

  <div class="studio-shell">
    <aside class="left-col">
      <div class="studio-tabs" id="studioTabs">
        <button type="button" class="s-tab is-active" data-pane="pane-equipos">Equipos</button>
        <button type="button" class="s-tab" data-pane="pane-diseno">Diseño</button>
        <button type="button" class="s-tab" data-pane="pane-fuentes">Fuentes</button>
        <button type="button" class="s-tab" data-pane="pane-rrss">RRSS</button>
        <button type="button" class="s-tab" data-pane="pane-especiales">Especiales</button>
      </div>

      <!-- EQUIPOS Y LOGOS -->
      <div class="pane is-active" id="pane-equipos">
        <div class="group-box">
          <div class="group-title">Equipo Local</div>
          <div class="field-row">
            <div class="field">
              <label>Nombre Local</label>
              <input type="text" id="cfgName1" value="LOCAL">
            </div>
            <div class="field">
              <label>Logo Local</label>
              <input type="file" id="fileLogo1" accept="image/*">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Color Fondo Local</label>
              <input type="color" id="cfgBg1" value="#1c1e24">
            </div>
            <div class="field">
              <label>Color Texto Local</label>
              <input type="color" id="cfgText1" value="#ffffff">
            </div>
          </div>
        </div>

        <div class="group-box">
          <div class="group-title">Equipo Visita</div>
          <div class="field-row">
            <div class="field">
              <label>Nombre Visita</label>
              <input type="text" id="cfgName2" value="VISITA">
            </div>
            <div class="field">
              <label>Logo Visita</label>
              <input type="file" id="fileLogo2" accept="image/*">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Color Fondo Visita</label>
              <input type="color" id="cfgBg2" value="#1c1e24">
            </div>
            <div class="field">
              <label>Color Texto Visita</label>
              <input type="color" id="cfgText2" value="#ffffff">
            </div>
          </div>
        </div>

        <div class="group-box">
          <div class="group-title">Liga y Badge Superior</div>
          <div class="field-row">
            <div class="field">
              <label>Logo Liga</label>
              <input type="file" id="fileLogoLiga" accept="image/*">
            </div>
            <div class="field">
              <label>Texto Badge Superior</label>
              <input type="text" id="cfgTopText" placeholder="Ej. FINAL / SEMIFINAL">
            </div>
          </div>
          <label class="check-line">
            <input type="checkbox" id="cfgTopBadgeEnabled">
            <span>Mostrar Badge Superior</span>
          </label>
        </div>
      </div>

      <!-- DISEÑO -->
      <div class="pane" id="pane-diseno">
        <div class="group-box">
          <div class="group-title">Tipografía y Escala</div>
          <div class="field-row">
            <div class="field">
              <label>Fuente</label>
              <select id="cfgFont">
                <option value="'Barlow Condensed', sans-serif">Barlow Condensed</option>
                <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                <option value="'Anton', sans-serif">Anton</option>
                <option value="'Oswald', sans-serif">Oswald</option>
                <option value="'Chakra Petch', sans-serif">Chakra Petch</option>
                <option value="'Rajdhani', sans-serif">Rajdhani</option>
                <option value="'Russo One', sans-serif">Russo One</option>
                <option value="'Teko', sans-serif">Teko</option>
              </select>
            </div>
            <div class="field">
              <label>Escala Marcador</label>
              <input type="number" id="cfgScale" step="0.05" min="0.5" max="1.6" value="1">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Borde / Acento</label>
              <input type="color" id="cfgAccent" value="#e3b857">
            </div>
            <div class="field">
              <label>Color Puntos</label>
              <input type="color" id="cfgScoreText" value="#e3b857">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Fondo Marcador Central</label>
              <input type="color" id="cfgScoreBg" value="#0c0d10">
            </div>
            <div class="field">
              <label>Fondo Reloj</label>
              <input type="color" id="cfgClockBg" value="#141519">
            </div>
          </div>
          <label class="check-line">
            <input type="checkbox" id="cfgShowShotClock" checked>
            <span>Mostrar Reloj de Posesión (24s)</span>
          </label>
        </div>
      </div>

      <!-- FUENTES DE DATOS -->
      <div class="pane" id="pane-fuentes">
        <div class="group-box">
          <div class="group-title">Origen por Campo</div>
          <div class="field-row">
            <div class="field">
              <label>Puntos Local</label>
              <select id="src_points_1">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
            <div class="field">
              <label>Puntos Visita</label>
              <select id="src_points_2">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Reloj de Partido</label>
              <select id="src_timer">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
            <div class="field">
              <label>Cuarto / Periodo</label>
              <select id="src_period">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Faltas Local</label>
              <select id="src_fouls_1">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
            <div class="field">
              <label>Faltas Visita</label>
              <select id="src_fouls_2">
                <option value="manual">Manual</option>
                <option value="scoresight">ScoreSight</option>
                <option value="flexyscore">Flexyscore</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- RRSS -->
      <div class="pane" id="pane-rrss">
        <div class="group-box">
          <div class="group-title">Rotación Automática (@tiempofuera_cl)</div>
          <label class="check-line">
            <input type="checkbox" id="cfgSocialAuto" checked>
            <span>Activar Rotación Automática</span>
          </label>
          <div class="field-row">
            <div class="field">
              <label>Posición</label>
              <select id="cfgSocialPos">
                <option value="top-left">Superior Izquierda</option>
                <option value="top-right">Superior Derecha</option>
              </select>
            </div>
            <div class="field">
              <label>Intervalo (seg)</label>
              <input type="number" id="cfgSocialInterval" min="15" max="900" value="150">
            </div>
          </div>
        </div>
      </div>

      <!-- COMPETENCIAS ESPECIALES -->
      <div class="pane" id="pane-especiales">
        <div class="group-box">
          <div class="group-title">Módulo en Control y Live</div>
          <label class="check-line">
            <input type="checkbox" class="mod-enable" data-mod="especiales" id="modEspecialesEnabled">
            <span>Habilitar Competencias Especiales</span>
          </label>
          <label class="check-line">
            <input type="checkbox" id="spModTriples" checked>
            <span>Incluir Concurso de Triples</span>
          </label>
          <label class="check-line">
            <input type="checkbox" id="spModTirosLibres" checked>
            <span>Incluir Concurso de Tiros Libres</span>
          </label>
        </div>
      </div>
    </aside>

    <section class="right-col">
      <div class="stage-toolbar">
        <span>Arrastra el marcador dentro del lienzo 16:9 para definir su posición en pantalla.</span>
        <span id="posReadout">X: 14% · Y: 76%</span>
      </div>
      <div class="stage-169" id="stage169">
        <div class="drag-box" id="dragBox" style="left:14%; top:76%;">
          <div id="previewMount"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="status-toast" id="statusToast">Guardado</div>

  <script type="module">
    import { db, DB_PATH, ref, update, onValue, requireSession } from "./js/firebase.js";

    let cfg = {
      sources: {
        points_1: "manual",
        points_2: "manual",
        timer: "manual",
        period: "manual",
        fouls_1: "manual",
        fouls_2: "manual",
        shotclock: "scoresight"
      },
      posX: 14,
      posY: 76,
      fontFamily: "'Barlow Condensed', sans-serif",
      boardScale: 1.0,
      ligaSize: 92,
      teamLogoSize: 44,
      teamFontSize: 25,
      scoreBoxSize: 48,
      clockFontSize: 32,
      accentColor: "#e3b857",
      foulActiveColor: "#ffe600",
      foulBonusColor: "#ff1744",
      name1: "LOCAL",
      bg1Color: "#1c1e24",
      text1Color: "#ffffff",
      name2: "VISITA",
      bg2Color: "#1c1e24",
      text2Color: "#ffffff",
      scoreBgColor: "#0c0d10",
      scoreTextColor: "#e3b857",
      shotBgColor: "#141519",
      shotTextColor: "#ff2a2a",
      clockBgColor: "#141519",
      clockTextColor: "#ffffff",
      periodTextColor: "#e3b857",
      showShotClock: true,
      topBadgeEnabled: false,
      topBadgeType: "text",
      topTextValue: "",
      logoLiga: "",
      logo1: "",
      logo2: "",
      socialAutoEnabled: true,
      socialPosition: "top-left",
      socialScale: 1.35,
      socialIntervalSec: 150
    };

    let currentMarcadoresOn = false;

    function showToast(msg) {
      const t = document.getElementById("statusToast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2600);
    }

    function syncFormFromCfg() {
      document.getElementById("cfgName1").value = cfg.name1 || "LOCAL";
      document.getElementById("cfgBg1").value = cfg.bg1Color || "#1c1e24";
      document.getElementById("cfgText1").value = cfg.text1Color || "#ffffff";
      document.getElementById("cfgName2").value = cfg.name2 || "VISITA";
      document.getElementById("cfgBg2").value = cfg.bg2Color || "#1c1e24";
      document.getElementById("cfgText2").value = cfg.text2Color || "#ffffff";
      document.getElementById("cfgTopText").value = cfg.topTextValue || "";
      document.getElementById("cfgTopBadgeEnabled").checked = Boolean(cfg.topBadgeEnabled);
      document.getElementById("cfgFont").value = cfg.fontFamily || "'Barlow Condensed', sans-serif";
      document.getElementById("cfgScale").value = cfg.boardScale ?? 1.0;
      document.getElementById("cfgAccent").value = cfg.accentColor || "#e3b857";
      document.getElementById("cfgScoreText").value = cfg.scoreTextColor || "#e3b857";
      document.getElementById("cfgScoreBg").value = cfg.scoreBgColor || "#0c0d10";
      document.getElementById("cfgClockBg").value = cfg.clockBgColor || "#141519";
      document.getElementById("cfgShowShotClock").checked = cfg.showShotClock !== false;
      document.getElementById("cfgSocialAuto").checked = cfg.socialAutoEnabled !== false;
      document.getElementById("cfgSocialPos").value = cfg.socialPosition || "top-left";
      document.getElementById("cfgSocialInterval").value = cfg.socialIntervalSec || 150;

      ["points_1", "points_2", "timer", "period", "fouls_1", "fouls_2"].forEach((k) => {
        const el = document.getElementById(`src_${k}`);
        if (el && cfg.sources?.[k]) el.value = cfg.sources[k];
      });
    }

    function readCfgFromForm() {
      cfg.name1 = document.getElementById("cfgName1").value.trim() || "LOCAL";
      cfg.bg1Color = document.getElementById("cfgBg1").value;
      cfg.text1Color = document.getElementById("cfgText1").value;
      cfg.name2 = document.getElementById("cfgName2").value.trim() || "VISITA";
      cfg.bg2Color = document.getElementById("cfgBg2").value;
      cfg.text2Color = document.getElementById("cfgText2").value;
      cfg.topTextValue = document.getElementById("cfgTopText").value.trim();
      cfg.topBadgeEnabled = document.getElementById("cfgTopBadgeEnabled").checked;
      cfg.topBadgeType = "text";
      cfg.fontFamily = document.getElementById("cfgFont").value;
      cfg.boardScale = parseFloat(document.getElementById("cfgScale").value) || 1.0;
      cfg.accentColor = document.getElementById("cfgAccent").value;
      cfg.scoreTextColor = document.getElementById("cfgScoreText").value;
      cfg.scoreBgColor = document.getElementById("cfgScoreBg").value;
      cfg.clockBgColor = document.getElementById("cfgClockBg").value;
      cfg.showShotClock = document.getElementById("cfgShowShotClock").checked;
      cfg.socialAutoEnabled = document.getElementById("cfgSocialAuto").checked;
      cfg.socialPosition = document.getElementById("cfgSocialPos").value;
      cfg.socialIntervalSec = parseInt(document.getElementById("cfgSocialInterval").value, 10) || 150;

      cfg.sources = {
        ...cfg.sources,
        points_1: document.getElementById("src_points_1").value,
        points_2: document.getElementById("src_points_2").value,
        timer: document.getElementById("src_timer").value,
        period: document.getElementById("src_period").value,
        fouls_1: document.getElementById("src_fouls_1").value,
        fouls_2: document.getElementById("src_fouls_2").value
      };
    }

    function renderPreview() {
      const box = document.getElementById("dragBox");
      box.style.left = `${cfg.posX ?? 14}%`;
      box.style.top = `${cfg.posY ?? 76}%`;
      document.getElementById("posReadout").textContent = `X: ${Math.round(cfg.posX ?? 14)}% · Y: ${Math.round(cfg.posY ?? 76)}%`;

      document.getElementById("previewMount").innerHTML = `
        <div style="transform:scale(${cfg.boardScale || 1});transform-origin:top left;display:inline-flex;align-items:center;height:68px;font-family:${cfg.fontFamily};background:${cfg.bg1Color};border:2px solid ${cfg.accentColor};border-radius:10px;padding:0 14px;gap:12px;">
          <span style="color:${cfg.text1Color};font-weight:800;font-size:22px;">${cfg.name1}</span>
          <span style="background:${cfg.scoreBgColor};color:${cfg.scoreTextColor};padding:4px 12px;border-radius:7px;font-weight:800;font-size:28px;">0 - 0</span>
          <span style="color:${cfg.text2Color};font-weight:800;font-size:22px;">${cfg.name2}</span>
          <span style="background:${cfg.clockBgColor};color:${cfg.clockTextColor};padding:4px 10px;border-radius:7px;font-weight:700;font-size:20px;">10:00 · Q1</span>
        </div>
      `;
    }

    // Arrastrar marcador en el lienzo 16:9
    const dragBox = document.getElementById("dragBox");
    const stage169 = document.getElementById("stage169");
    let dragging = false;

    dragBox.addEventListener("pointerdown", (e) => {
      dragging = true;
      dragBox.setPointerCapture(e.pointerId);
    });
    dragBox.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const rect = stage169.getBoundingClientRect();
      const xPct = Math.max(0, Math.min(82, ((e.clientX - rect.left) / rect.width) * 100));
      const yPct = Math.max(2, Math.min(88, ((e.clientY - rect.top) / rect.height) * 100));
      cfg.posX = Math.round(xPct * 10) / 10;
      cfg.posY = Math.round(yPct * 10) / 10;
      renderPreview();
    });
    dragBox.addEventListener("pointerup", () => { dragging = false; });

    function bindFileLogo(inputId, key) {
      document.getElementById(inputId).addEventListener("change", (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          cfg[key] = ev.target.result;
          showToast("Logo cargado");
        };
        reader.readAsDataURL(f);
      });
    }
    bindFileLogo("fileLogo1", "logo1");
    bindFileLogo("fileLogo2", "logo2");
    bindFileLogo("fileLogoLiga", "logoLiga");

    document.querySelectorAll("input, select").forEach((el) => {
      el.addEventListener("input", () => { readCfgFromForm(); renderPreview(); });
      el.addEventListener("change", () => { readCfgFromForm(); renderPreview(); });
    });

    document.querySelectorAll(".s-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".s-tab").forEach((t) => t.classList.remove("is-active"));
        tab.classList.add("is-active");
        document.querySelectorAll(".pane").forEach((p) => p.classList.remove("is-active"));
        document.getElementById(tab.dataset.pane).classList.add("is-active");
      });
    });

    // Botón 🆕 Nuevo Partido: oculta marcador, resetea marcadores y limpia equipos/logos para preparar el siguiente partido
    document.getElementById("newMatchBtn").addEventListener("click", async () => {
      cfg = {
        ...cfg,
        name1: "LOCAL",
        name2: "VISITA",
        logo1: "",
        logo2: "",
        topTextValue: "",
        topBadgeEnabled: false
      };
      ["fileLogo1", "fileLogo2"].forEach((id) => {
        const inp = document.getElementById(id);
        if (inp) inp.value = "";
      });
      syncFormFromCfg();
      renderPreview();

      await update(ref(db, `${DB_PATH}/modules/marcadores`), {
        on: false,
        config: cfg,
        pos: { x: cfg.posX, y: cfg.posY },
        liveData: null,
        feeds: {
          manual: {
            points_1: 0,
            points_2: 0,
            timer: "10:00",
            period: 1,
            fouls_1: 0,
            fouls_2: 0,
            shotclock: 24
          },
          scoresight: null
        }
      });

      showToast("Nuevo partido listo: marcador oculto y en 0");
    });

    document.getElementById("saveAllBtn").addEventListener("click", async () => {
      readCfgFromForm();

      const mods = [];
      if (document.getElementById("spModTriples").checked) mods.push("triples");
      if (document.getElementById("spModTirosLibres").checked) mods.push("tiros_libres");
      const espEnabled = document.getElementById("modEspecialesEnabled").checked;

      await update(ref(db, `${DB_PATH}/modules/marcadores`), {
        enabled: true,
        config: cfg,
        pos: { x: cfg.posX, y: cfg.posY }
      });

      await update(ref(db, `${DB_PATH}/modules/especiales`), {
        enabled: espEnabled,
        config: { modules: mods.length ? mods : ["triples", "tiros_libres"] }
      });

      showToast("Configuración guardada y sincronizada");
    });

    requireSession(() => {
      onValue(ref(db, `${DB_PATH}/modules/marcadores`), (snap) => {
        if (!snap.exists()) return;
        const val = snap.val();
        currentMarcadoresOn = Boolean(val.on);
        const pill = document.getElementById("liveStatusPill");
        pill.textContent = currentMarcadoresOn ? "Marcador: ON AIR" : "Marcador: OFF AIR";
        pill.style.color = currentMarcadoresOn ? "#4ade80" : "var(--muted)";

        if (val.config) {
          cfg = {
            ...cfg,
            ...val.config,
            posX: val.pos?.x ?? val.config.posX ?? cfg.posX,
            posY: val.pos?.y ?? val.config.posY ?? cfg.posY,
            sources: { ...cfg.sources, ...(val.config.sources || {}) }
          };
          syncFormFromCfg();
          renderPreview();
        }
      });

      onValue(ref(db, `${DB_PATH}/modules/especiales`), (snap) => {
        if (!snap.exists()) return;
        const val = snap.val();
        document.getElementById("modEspecialesEnabled").checked = Boolean(val.enabled);
        const mods = Array.isArray(val.config?.modules) ? val.config.modules : ["triples", "tiros_libres"];
        document.getElementById("spModTriples").checked = mods.includes("triples");
        document.getElementById("spModTirosLibres").checked = mods.includes("tiros_libres");
      });
    });

    syncFormFromCfg();
    renderPreview();
  </script>
</body>
</html>
