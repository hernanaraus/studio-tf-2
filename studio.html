<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiempo Fuera — Estudio · Competencias Especiales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #0c0e14;
      --bg-panel: #141822;
      --bg-card: #1b202d;
      --bg-input: #10131b;
      --accent: #e11d2e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --ok: #22c55e;
      --gold: #facc15;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .studio-container {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .panel-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
    }

    .toggle-row span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .toggle-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    button:hover {
      background: #242b3c;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* VISTA PREVIA DEL OVERLAY (MÁXIMO 720PX) */
    .preview-stage {
      background: repeating-conic-gradient(#171b26 0% 25%, #11151f 0% 50%) 50% / 24px 24px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 360px;
    }

    .preview-box {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pv-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background: var(--pv-bg, rgba(14, 16, 22, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-left: 4px solid var(--pv-accent, #e11d2e);
      border-radius: 9px;
    }

    .pv-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .pv-logo {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: var(--pv-accent, #e11d2e);
    }

    .pv-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
    }

    .pv-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 18px;
      text-transform: uppercase;
      line-height: 1.05;
    }

    .pv-sub {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .pv-clock {
      background: var(--pv-accent, #e11d2e);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 22px;
      padding: 4px 10px;
      border-radius: 7px;
    }

    .pv-card {
      background: var(--pv-bg, rgba(14, 16, 22, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 11px;
      padding: 14px 16px;
    }

    .pv-idle {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 14px;
      align-items: center;
    }

    .pv-idle-logo {
      width: 96px;
      height: 82px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 20px;
      color: var(--pv-accent, #e11d2e);
    }

    .pv-idle-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .pv-rules-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .pv-rules-body {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-muted);
      white-space: pre-line;
    }

    .pv-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pv-first {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 32px;
      line-height: 0.96;
      text-transform: uppercase;
    }

    .pv-last {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .pv-pts {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1;
      color: var(--gold);
    }

    @media (max-width: 980px) {
      .studio-container {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="studio-container">
    <!-- CONFIGURACIÓN DE COMPETENCIAS ESPECIALES -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">ESTUDIO · COMPETENCIAS ESPECIALES</span>
        <span id="syncStatus" class="status-pill">SINCRONIZADO</span>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="spDiscipline">Competencia</label>
          <select id="spDiscipline">
            <option value="triples">Concurso de Triples</option>
            <option value="libres">Tiros Libres / Femicentro</option>
          </select>
        </div>

        <div class="field">
          <label for="spModePreset">Modalidad / Formato</label>
          <select id="spModePreset">
            <option value="triples_timed">Triples Oficial (Con Reloj)</option>
            <option value="triples_no_timer">Triples Sin Reloj</option>
            <option value="femicentro">Femicentro (Sin Reloj)</option>
            <option value="libres_timed">Tiros Libres (Con Reloj)</option>
          </select>
        </div>

        <div class="field">
          <label for="spTitle">Título en Overlay</label>
          <input id="spTitle" type="text" value="CONCURSO DE TRIPLES" />
        </div>

        <div class="field">
          <label for="spSubtitle">Subtítulo</label>
          <input id="spSubtitle" type="text" value="COMPETENCIA ESPECIAL" />
        </div>

        <div class="field full">
          <label for="spLogo">URL Logo del Torneo (vacío = hereda del marcador)</label>
          <input id="spLogo" type="url" placeholder="https://.../logo-torneo.png" />
        </div>

        <div class="field">
          <label for="spAccent">Color Acento (vacío = hereda del marcador)</label>
          <input id="spAccent" type="color" value="#e11d2e" />
        </div>

        <div class="field">
          <label for="spPreviewPlayer">Vista Previa (Jugador)</label>
          <select id="spPreviewPlayer">
            <option value="idle">Sin jugador (Logo + Reglas)</option>
            <option value="sample">Con jugador (Nombre / Apellido)</option>
          </select>
        </div>

        <div class="field full">
          <label for="spRules">Reglas (mostradas cuando no hay jugador seleccionado)</label>
          <textarea id="spRules" rows="3">5 carros de 5 balones en distintas zonas de la cancha.
Balón normal = 1 pt · Balón dinero / especial = 2 pts.
Selecciona un participante desde Control para iniciar.</textarea>
        </div>
      </div>

      <div class="toggle-row">
        <span>USAR CRONÓMETRO EN ESTA COMPETENCIA</span>
        <input id="spUseTimer" type="checkbox" />
      </div>

      <div class="actions-row">
        <button id="btnSyncNow" class="primary" type="button">SINCRONIZAR AHORA</button>
      </div>
    </section>

    <!-- VISTA PREVIA EN TIEMPO REAL (MÁX. 720PX) -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">VISTA PREVIA OVERLAY (MÁX. 720PX)</span>
        <span id="pvTimerTag" class="status-pill">SIN RELOJ</span>
      </div>

      <div class="preview-stage">
        <div id="previewBox" class="preview-box">
          <div class="pv-top">
            <div class="pv-brand">
              <div id="pvTopLogo" class="pv-logo">TF</div>
              <div>
                <div id="pvTitle" class="pv-title">CONCURSO DE TRIPLES</div>
                <div id="pvSubtitle" class="pv-sub">COMPETENCIA ESPECIAL</div>
              </div>
            </div>
            <div id="pvClock" class="pv-clock hidden">01:00</div>
          </div>

          <div id="pvIdleCard" class="pv-card pv-idle">
            <div id="pvIdleLogo" class="pv-idle-logo">TORNEO</div>
            <div>
              <div class="pv-rules-title">REGLAS DEL CONCURSO</div>
              <div id="pvRules" class="pv-rules-body"></div>
            </div>
          </div>

          <div id="pvPlayerCard" class="pv-card pv-player hidden">
            <div>
              <div class="pv-first">CAMILA</div>
              <div class="pv-last">ROJAS</div>
            </div>
            <div class="pv-pts">14</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Firebase Compat (opcional si existe configuración global o ?dbUrl=) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    (function () {
      const els = {
        spDiscipline: document.getElementById('spDiscipline'),
        spModePreset: document.getElementById('spModePreset'),
        spTitle: document.getElementById('spTitle'),
        spSubtitle: document.getElementById('spSubtitle'),
        spLogo: document.getElementById('spLogo'),
        spAccent: document.getElementById('spAccent'),
        spPreviewPlayer: document.getElementById('spPreviewPlayer'),
        spRules: document.getElementById('spRules'),
        spUseTimer: document.getElementById('spUseTimer'),
        btnSyncNow: document.getElementById('btnSyncNow'),
        syncStatus: document.getElementById('syncStatus'),
        pvTimerTag: document.getElementById('pvTimerTag'),
        previewBox: document.getElementById('previewBox'),
        pvTopLogo: document.getElementById('pvTopLogo'),
        pvTitle: document.getElementById('pvTitle'),
        pvSubtitle: document.getElementById('pvSubtitle'),
        pvClock: document.getElementById('pvClock'),
        pvIdleCard: document.getElementById('pvIdleCard'),
        pvIdleLogo: document.getElementById('pvIdleLogo'),
        pvRules: document.getElementById('pvRules'),
        pvPlayerCard: document.getElementById('pvPlayerCard')
      };

      const bcTriples = ('BroadcastChannel' in window)
        ? new BroadcastChannel('tiempofuera_especiales_triples')
        : null;
      const bcLibres = ('BroadcastChannel' in window)
        ? new BroadcastChannel('tiempofuera_especiales_libres')
        : null;

      let inheritedLogo = '';
      let inheritedAccent = '#e11d2e';
      let db = null;

      const params = new URLSearchParams(window.location.search);
      const dbUrl = params.get('dbUrl') || window.TF_FIREBASE_DB_URL || '';

      if (dbUrl && window.firebase) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp({
              databaseURL: dbUrl,
              ...(window.TF_FIREBASE_CONFIG || {})
            });
          }
          db = firebase.database();
          db.ref('marcadores/config').on('value', (snap) => {
            if (!snap.exists()) return;
            const mCfg = snap.val() || {};
            if (mCfg.logoLiga) inheritedLogo = String(mCfg.logoLiga).trim();
            if (mCfg.accentColor) inheritedAccent = String(mCfg.accentColor).trim();
            syncSpecialConfigNow();
          });
        } catch (err) {
          console.warn('Firebase studio sync warning:', err);
        }
      }

      function applyPresetSideEffects(preset) {
        if (preset === 'femicentro' || preset === 'triples_no_timer') {
          els.spUseTimer.checked = false;
        } else if (preset === 'triples_timed' || preset === 'libres_timed') {
          els.spUseTimer.checked = true;
        }

        if (preset === 'femicentro') {
          els.spDiscipline.value = 'libres';
          if (!els.spTitle.value.trim() || els.spTitle.value === 'CONCURSO DE TRIPLES') {
            els.spTitle.value = 'FEMICENTRO';
          }
        } else if (preset === 'libres_timed') {
          els.spDiscipline.value = 'libres';
        } else if (preset === 'triples_timed' || preset === 'triples_no_timer') {
          els.spDiscipline.value = 'triples';
        }
      }

      function getEffectiveLogo() {
        return els.spLogo.value.trim() || inheritedLogo || '';
      }

      function getEffectiveAccent() {
        return els.spAccent.value.trim() || inheritedAccent || '#e11d2e';
      }

      function renderPreview() {
        const useTimer = Boolean(els.spUseTimer.checked);
        const accent = getEffectiveAccent();
        const logo = getEffectiveLogo();
        const title = els.spTitle.value.trim() || 'COMPETENCIA ESPECIAL';
        const subtitle = els.spSubtitle.value.trim() || 'TIEMPO FUERA';
        const rules = els.spRules.value.trim() || 'Sin reglas definidas.';
        const showSamplePlayer = els.spPreviewPlayer.value === 'sample';

        els.previewBox.style.setProperty('--pv-accent', accent);
        els.pvTitle.textContent = title;
        els.pvSubtitle.textContent = subtitle;
        els.pvRules.textContent = rules;

        els.pvClock.classList.toggle('hidden', !useTimer);
        els.pvTimerTag.textContent = useTimer ? 'CON RELOJ' : 'SIN RELOJ';

        if (logo) {
          els.pvTopLogo.innerHTML = `<img src="${logo}" alt="Logo" onerror="this.parentElement.textContent='TF'" />`;
          els.pvIdleLogo.innerHTML = `<img src="${logo}" alt="Logo" onerror="this.parentElement.textContent='TORNEO'" />`;
        } else {
          els.pvTopLogo.textContent = 'TF';
          els.pvIdleLogo.textContent = 'TORNEO';
        }

        els.pvIdleCard.classList.toggle('hidden', showSamplePlayer);
        els.pvPlayerCard.classList.toggle('hidden', !showSamplePlayer);
      }

      function syncSpecialConfigNow() {
        renderPreview();

        const discipline = els.spDiscipline.value;
        const useTimer = Boolean(els.spUseTimer.checked);
        const configPayload = {
          title: els.spTitle.value.trim() || 'COMPETENCIA ESPECIAL',
          subtitle: els.spSubtitle.value.trim() || 'TIEMPO FUERA',
          tournamentLogo: getEffectiveLogo(),
          accentColor: getEffectiveAccent(),
          rules: els.spRules.value.trim(),
          useTimer,
          modePreset: els.spModePreset.value
        };

        const patch = {
          config: configPayload,
          live: {
            customTimerOverride: null,
            timerRunning: useTimer ? undefined : false
          }
        };

        try {
          const storageKey = discipline === 'libres' ? 'tf_libres_live_state' : 'tf_triples_live_state';
          const currentRaw = localStorage.getItem(storageKey);
          const currentObj = currentRaw ? JSON.parse(currentRaw) : {};
          const merged = {
            ...currentObj,
            config: {
              ...(currentObj.config || {}),
              ...configPayload
            },
            live: {
              ...(currentObj.live || {}),
              customTimerOverride: null,
              ...(useTimer ? {} : { timerRunning: false })
            }
          };
          localStorage.setItem(storageKey, JSON.stringify(merged));
          localStorage.setItem('tf_especiales_control_state', JSON.stringify(merged));
        } catch (_) {}

        if (discipline === 'libres' && bcLibres) bcLibres.postMessage(patch);
        if (discipline === 'triples' && bcTriples) bcTriples.postMessage(patch);
        window.postMessage({ discipline, ...patch }, '*');

        if (db) {
          const path = discipline === 'libres' ? 'modules/especiales/libres' : 'modules/especiales/triples';
          db.ref(`${path}/config`).update(configPayload).catch(() => {});
          db.ref(`${path}/live/customTimerOverride`).set(null).catch(() => {});
          if (!useTimer) {
            db.ref(`${path}/live/timerRunning`).set(false).catch(() => {});
          }
        }

        els.syncStatus.textContent = 'SINCRONIZADO';
      }

      els.spModePreset.addEventListener('change', () => {
        applyPresetSideEffects(els.spModePreset.value);
        syncSpecialConfigNow();
      });

      els.spUseTimer.addEventListener('change', syncSpecialConfigNow);
      els.spDiscipline.addEventListener('change', syncSpecialConfigNow);
      els.spTitle.addEventListener('input', syncSpecialConfigNow);
      els.spSubtitle.addEventListener('input', syncSpecialConfigNow);
      els.spLogo.addEventListener('input', syncSpecialConfigNow);
      els.spAccent.addEventListener('input', syncSpecialConfigNow);
      els.spRules.addEventListener('input', syncSpecialConfigNow);
      els.spPreviewPlayer.addEventListener('change', renderPreview);
      els.btnSyncNow.addEventListener('click', syncSpecialConfigNow);

      renderPreview();
      syncSpecialConfigNow();
    })();
  </script>
</body>
</html>
